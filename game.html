 { id: "food", name: "Yummy Food", emoji: "🍕", intro: "Time to eat! Let's learn about yummy food.", qs: [
  [1, "🍎", "“An ___ a day keeps the doctor away.” Which fruit finishes the saying?", "Apple", ["Banana", "Grape", "Lemon"], "“An <b>apple</b> a day keeps the doctor away!”"],
  [1, "🥛", "Which drink comes from cows?", "Milk", ["Orange juice", "Lemonade", "Apple juice"], "<b>Milk</b> comes from cows. It helps build strong bones."],
  [2, "🥕", "Which orange vegetable grows under the ground and is a bunny's favorite snack?", "Carrot", ["Broccoli", "Corn", "Peas"], "<b>Carrots</b> grow under the ground. Bunnies love to munch them!"],
  [2, "🍞", "Bread, pasta, and cereal are made mostly from which kind of food?", "Grains", ["Fruits", "Meats", "Dairy"], "Bread, pasta, and cereal are made from <b>grains</b> like wheat, oats, and rice."],
  [3, "🍕", "Pizza first came from which country?", "Italy", ["Mexico", "China", "France"], "Pizza comes from <b>Italy</b>. The city of Naples is famous for it."],
  [3, "🍫", "Chocolate is made from the beans of which plant?", "Cacao", ["Coffee", "Vanilla", "Peanut"], "Chocolate is made from <b>cacao</b> beans. They grow in big pods on cacao trees."],
  [4, "🍅", "Scientists call a tomato which kind of food, because it grows from a flower and has seeds inside?", "A fruit", ["A vegetable", "A grain", "A nut"], "To scientists, a tomato is a <b>fruit</b> because it grows from a flower and has seeds."],
  [4, "🥜", "Peanuts aren't really nuts! They are in the same plant family as beans and peas. What are they called?", "Legumes", ["Berries", "Grains", "Roots"], "Peanuts are <b>legumes</b>, like beans and peas. They grow underground!"],
  [5, "🍯", "Which sweet food almost never spoils? Jars thousands of years old were found in Egyptian tombs!", "Honey", ["Bread", "Cheese", "Jelly"], "<b>Honey</b> almost never spoils. Jars thousands of years old were found in ancient Egyptian tombs!"],
  [5, "🍣", "Sushi is a famous food from which country?", "Japan", ["China", "Italy", "Mexico"], "Sushi comes from <b>Japan</b>. It is made with rice, often with fish or vegetables."],
  [1,"🍌","Which long, yellow fruit do monkeys love?","A banana",["A lemon","A pear","A grape"],"Monkeys love <b>bananas</b>! You peel the yellow skin to eat it."],
  [2,"🧀","Which of these foods is made from milk?","Cheese",["Bread","Jelly","Pickles"],"<b>Cheese</b> is made from milk. So are yogurt and butter!"],
  [2,"🍟","French fries are made from which vegetable?","Potatoes",["Carrots","Apples","Onions"],"French fries are made from <b>potatoes</b>."],
  [3,"🌮","Tacos are a famous food from which country?","Mexico",["France","China","Canada"],"Tacos come from <b>Mexico</b>."],
  [3,"🍿","Which grain pops to make popcorn?","Corn",["Rice","Wheat","Oats"],"Popcorn is made from <b>corn</b>. A tiny drop of water inside each kernel heats up and makes it pop!"],
  [4,"🍇","Raisins are dried what?","Grapes",["Plums","Cherries","Blueberries"],"Raisins are dried <b>grapes</b>. Dried plums are called prunes."],
  [4,"🍊","Oranges are famous for having lots of which vitamin?","Vitamin C",["Vitamin A","Vitamin D","Vitamin K"],"Oranges have lots of <b>vitamin C</b>, which helps your body heal and stay healthy."],
  [5,"🍞","What tiny living thing makes bread dough rise?","Yeast",["Salt","Sugar","Butter"],"<b>Yeast</b> is a tiny living thing. It makes gas bubbles that puff up the dough."],
  [5,"🥚","Beans, eggs, fish, and meat are all part of which food group that helps build muscles?","Protein",["Dairy","Grains","Fruit"],"Beans, eggs, fish, and meat are <b>protein</b> foods. Protein helps build strong muscles."],
  [5,"🥑","Guacamole is made mostly from which fruit?","Avocado",["Lime","Green pepper","Cucumber"],"Guacamole is made from mashed <b>avocado</b>. Yes, an avocado is a fruit!"],
 ]},
 { id: "myths", name: "Myths & Legends", emoji: "🦄", intro: "Gods, heroes, and magical creatures! Let's hear some old stories.", qs: [
  [1, "🦄", "Which make-believe horse has one horn on its head?", "A unicorn", ["A dragon", "A zebra", "A mermaid"], "A <b>unicorn</b> is a make-believe horse with one horn."],
  [1, "🐉", "Which make-believe creature is a giant flying lizard that can breathe fire?", "A dragon", ["A mermaid", "A troll", "A fairy"], "A <b>dragon</b> breathes fire in lots of stories, like Dragon Masters!"],
  [2, "🧜", "Which sea creature is half person and half fish?", "A mermaid", ["A centaur", "A troll", "A giant"], "A <b>mermaid</b> is half person and half fish. Ariel is a mermaid!"],
  [2, "🐴", "What was the name of the flying horse with wings in Greek myths?", "Pegasus", ["Hercules", "Medusa", "Zeus"], "<b>Pegasus</b> was a horse with wings in the Greek myths."],
  [3, "⚡", "Who was the king of the Greek gods, who threw lightning bolts?", "Zeus", ["Hades", "Apollo", "Poseidon"], "<b>Zeus</b> was the king of the Greek gods. He threw lightning bolts!"],
  [3, "💪", "Which Greek hero was famous for being super strong?", "Hercules", ["Achilles", "Perseus", "Odysseus"], "<b>Hercules</b> was the strongest hero in the Greek myths. Disney even made a movie about him!"],
  [4, "🐍", "Which monster in Greek myths had snakes for hair?", "Medusa", ["The Minotaur", "The Cyclops", "The Sphinx"], "<b>Medusa</b> had snakes for hair. One look at her turned people to stone!"],
  [4, "🌊", "Who was the Greek god of the sea?", "Poseidon", ["Zeus", "Hermes", "Ares"], "<b>Poseidon</b> was the Greek god of the sea. He carried a three-pointed spear called a trident."],
  [5, "🔨", "In Norse myths, which god of thunder carried a magic hammer?", "Thor", ["Loki", "Odin", "Zeus"], "<b>Thor</b> was the Norse god of thunder. His hammer was named Mjolnir."],
  [5, "👁️", "In Greek myths, what kind of giant had only one eye?", "A Cyclops", ["A Titan", "A centaur", "A satyr"], "A <b>Cyclops</b> was a giant with one eye in the middle of its forehead."],
  [1,"🧚","Which tiny make-believe creature has wings and sprinkles magic dust, like Tinker Bell?","A fairy",["A troll","A giant","A dragon"],"Tinker Bell is a <b>fairy</b>. Fairies are tiny magic creatures with wings."],
  [2,"🌉","In “The Three Billy Goats Gruff,” who lives under the bridge?","A troll",["A dragon","A wolf","A giant"],"A grumpy <b>troll</b> lives under the bridge, but the biggest billy goat knocks him away!"],
  [2,"🐎","Which make-believe creature is half person and half horse?","A centaur",["A mermaid","A unicorn","A griffin"],"A <b>centaur</b> is half person and half horse."],
  [3,"🦅","Which make-believe creature is half eagle and half lion?","A griffin",["A phoenix","A unicorn","A centaur"],"A <b>griffin</b> has the head and wings of an eagle and the body of a lion."],
  [3,"🔥","Which make-believe bird bursts into flames and is born again from its ashes?","A phoenix",["A griffin","An eagle","A peacock"],"The <b>phoenix</b> bursts into flames when it gets old, then rises again from the ashes."],
  [4,"🦉","Who was the Greek goddess of wisdom, whose symbol was an owl?","Athena",["Aphrodite","Hera","Artemis"],"<b>Athena</b> was the goddess of wisdom. The city of Athens is named after her."],
  [4,"🐂","Which half-man, half-bull monster lived in a maze called the Labyrinth?","The Minotaur",["The Cyclops","Medusa","The Hydra"],"<b>The Minotaur</b> lived in the Labyrinth until the hero Theseus defeated it."],
  [5,"🪶","Which boy flew too close to the Sun on wings made of wax and feathers?","Icarus",["Hercules","Perseus","Achilles"],"<b>Icarus</b> flew too high. The Sun melted the wax, and he fell into the sea."],
  [5,"🐍","Which Greek hero defeated Medusa?","Perseus",["Hercules","Theseus","Jason"],"<b>Perseus</b> used a shiny shield as a mirror so he wouldn't look right at Medusa."],
  [5,"🐦","In Norse myths, who was the one-eyed father of the gods?","Odin",["Loki","Thor","Zeus"],"<b>Odin</b> was the king of the Norse gods and Thor's father. He had two ravens that told him the news."],
 ]},
 { id: "arts", name: "Art & Music", emoji: "🎨", intro: "Grab a paintbrush and tune up! Let's learn about art and music.", qs: [
  [1, "🎨", "Which color do you get when you mix blue and yellow?", "Green", ["Purple", "Orange", "Brown"], "Blue and yellow make <b>green</b>!"],
  [1, "🥁", "Which instrument do you play by hitting it with sticks?", "A drum", ["A flute", "A guitar", "A trumpet"], "You play a <b>drum</b> by hitting it with sticks."],
  [2, "🖍️", "Red, yellow, and blue are called the ___ colors.", "Primary", ["Secondary", "Rainbow", "Cool"], "Red, yellow, and blue are the <b>primary</b> colors. You can mix them to make other colors."],
  [2, "🎹", "Which instrument has black and white keys?", "A piano", ["A violin", "A drum", "A harp"], "A <b>piano</b> has black and white keys."],
  [3, "🖼️", "Which famous painting shows a woman with a mysterious smile?", "The Mona Lisa", ["The Starry Night", "The Scream", "Water Lilies"], "The <b>Mona Lisa</b>, painted by Leonardo da Vinci, has a famous mysterious smile."],
  [3, "🎻", "Which instrument has four strings and is played with a bow, tucked under your chin?", "A violin", ["A cello", "A guitar", "A banjo"], "You play a <b>violin</b> with a bow while holding it under your chin."],
  [4, "🌌", "Which artist painted “The Starry Night”?", "Vincent van Gogh", ["Pablo Picasso", "Leonardo da Vinci", "Claude Monet"], "<b>Vincent van Gogh</b> painted “The Starry Night” in 1889."],
  [4, "🎹", "How many keys does a regular piano have?", "88", ["52", "100", "64"], "A regular piano has <b>88</b> keys: 52 white and 36 black."],
  [5, "🎼", "Which famous composer kept writing music even after he went deaf?", "Beethoven", ["Mozart", "Bach", "Chopin"], "<b>Beethoven</b> kept writing music even after he lost his hearing."],
  [5, "⛪", "Michelangelo painted the ceiling of which famous chapel?", "The Sistine Chapel", ["Westminster Abbey", "Notre-Dame", "The White House"], "Michelangelo painted the ceiling of the <b>Sistine Chapel</b> in Vatican City."],
  [1,"🎀","What color do you get when you mix red and white?","Pink",["Purple","Orange","Brown"],"Red and white make <b>pink</b>!"],
  [2,"🎶","Which of these instruments do you play by blowing into it?","A flute",["A drum","A guitar","A piano"],"You play a <b>flute</b> by blowing across a hole at the top."],
  [2,"🟠","What color do you get when you mix red and yellow?","Orange",["Green","Purple","Brown"],"Red and yellow make <b>orange</b>!"],
  [3,"🎸","How many strings does a regular guitar have?","6",["4","5","12"],"A regular guitar has <b>6 strings</b>."],
  [3,"🎼","Who leads an orchestra by waving a small stick called a baton?","A conductor",["A composer","A drummer","A painter"],"The <b>conductor</b> leads the orchestra and keeps everyone playing together."],
  [4,"🗿","What do we call an artist who carves statues out of stone or wood?","A sculptor",["A painter","A composer","An architect"],"An artist who makes statues is a <b>sculptor</b>."],
  [4,"🎺","Which instrument family do the trumpet and the trombone belong to?","Brass",["Strings","Woodwinds","Percussion"],"Trumpets and trombones are in the <b>brass</b> family. You buzz your lips to play them!"],
  [5,"🎨","What do we call colors that are opposite each other on the color wheel, like red and green?","Complementary colors",["Primary colors","Warm colors","Neutral colors"],"Opposite colors on the wheel are <b>complementary colors</b>. They make each other look extra bright."],
  [5,"🎹","Which famous composer started writing music when he was only 5 years old?","Mozart",["Beethoven","Bach","Chopin"],"<b>Mozart</b> wrote his first music at age 5 and played for kings and queens as a kid."],
  [5,"🖼️","Which Spanish artist painted faces with both eyes on the same side, in a style called Cubism?","Pablo Picasso",["Claude Monet","Vincent van Gogh","Frida Kahlo"],"<b>Pablo Picasso</b> helped invent Cubism, painting things from many sides at once."],
 ]},
 { id: "science", name: "Science Lab", emoji: "🧪", intro: "Put on your goggles! It's time for science.", qs: [
  [1,"🧲","Which of these will stick to a magnet?","A paper clip",["A wooden block","A plastic cup","A rubber ball"],"Magnets pull on things made of iron and steel, like a <b>paper clip</b>."],
  [1,"🧊","What happens to ice when it gets warm?","It melts",["It grows","It turns to rock","It gets colder"],"When ice gets warm, <b>it melts</b> and turns back into water."],
  [1,"🔍","What does a magnifying glass do?","Makes small things look bigger",["Makes things louder","Measures how hot it is","Tells time"],"A magnifying glass <b>makes small things look bigger</b>, so you can see tiny details."],
  [2,"💧","Is water a solid, a liquid, or a gas?","A liquid",["A solid","A gas","A rock"],"Water is a <b>liquid</b>. It flows and takes the shape of its cup."],
  [2,"👤","What makes a shadow?","Something blocking the light",["The wind","Water","Loud sounds"],"A shadow happens when <b>something blocks the light</b>."],
  [2,"🏔️","What do we call a sound that bounces back to you, like when you shout in a cave?","An echo",["A shadow","A whisper","A rainbow"],"A sound that bounces back is an <b>echo</b>. Hello, hello, hello!"],
  [2,"🪞","What does a mirror do to light?","Bounces it back",["Eats it up","Turns it off","Makes it louder"],"A mirror <b>bounces light back</b>. Scientists call that reflecting."],
  [3,"🧪","What are the three states of matter?","Solid, liquid, gas",["Hot, warm, cold","Rock, paper, scissors","Big, medium, small"],"The three states of matter are <b>solid, liquid, and gas</b>, like ice, water, and steam."],
  [3,"🏋️","What do scientists call a push or a pull?","A force",["A shadow","An echo","A magnet"],"A push or a pull is a <b>force</b>. Kicking a ball uses a force!"],
  [3,"🧲","What are the two ends of a magnet called?","North and south poles",["Top and bottom","Hot and cold","Left and right"],"Every magnet has a <b>north pole and a south pole</b>. Opposite poles pull together."],
  [3,"🌈","When white light shines through a prism, what does it split into?","A rainbow of colors",["Darkness","Bubbles","Sparks"],"A prism splits white light into <b>a rainbow of colors</b>. White light is all the colors mixed together!"],
  [4,"⚡","What do we call materials that let electricity flow through them easily, like copper?","Conductors",["Insulators","Magnets","Batteries"],"Materials that carry electricity well are <b>conductors</b>. Rubber and plastic are insulators, which block it."],
  [4,"📐","Which simple machine is really just a ramp?","An inclined plane",["A lever","A pulley","A wheel and axle"],"A ramp is an <b>inclined plane</b>. It makes it easier to move heavy things up."],
  [4,"🛷","What force slows things down when they rub against each other?","Friction",["Gravity","Magnetism","Electricity"],"<b>Friction</b> slows things down when they rub. That's why it's hard to slide on carpet."],
  [4,"🌩️","Which travels faster, light or sound?","Light",["Sound","They're the same","Neither one moves"],"<b>Light</b> is much faster than sound. That's why you see lightning before you hear thunder!"],
  [5,"⚛️","What are the super tiny building blocks that everything is made of, even air and rocks?","Atoms",["Crumbs","Pixels","Specks"],"Everything is made of <b>atoms</b>. They're so small that millions could fit on the dot of an i."],
  [5,"🚰","What is H₂O the science name for?","Water",["Salt","Air","Gold"],"<b>Water</b> is H₂O: two hydrogen atoms and one oxygen atom."],
  [5,"🍎","Which scientist explained gravity after, the story goes, seeing an apple fall?","Isaac Newton",["Albert Einstein","Thomas Edison","Galileo"],"<b>Isaac Newton</b> explained gravity more than 300 years ago."],
  [5,"🌡️","At what temperature does water freeze on the Fahrenheit scale?","32 degrees",["0 degrees","100 degrees","212 degrees"],"Water freezes at <b>32 degrees</b> Fahrenheit. That's 0 degrees Celsius."],
  [5,"📝","What do we call a scientist's careful guess that can be tested with an experiment?","A hypothesis",["A conclusion","A result","A recipe"],"A testable guess is a <b>hypothesis</b>. Then you do an experiment to see if it's right!"],
 ]},
 { id: "castles", name: "Knights & Castles", emoji: "🛡️", intro: "Raise the drawbridge! Let's visit a castle long ago.", qs: [
  [1,"👑","Who rules a kingdom along with the queen?","The king",["The jester","The cook","The farmer"],"<b>The king</b> and queen rule the kingdom from their castle."],
  [1,"🛡️","What does a knight wear to protect his body in battle?","Armor",["Pajamas","A raincoat","A tutu"],"Knights wore metal <b>armor</b>. A full suit could weigh as much as a 2nd grader!"],
  [1,"🐉","In old stories, which fire-breathing beast do brave knights fight?","A dragon",["A unicorn","A puppy","A dolphin"],"In old stories, brave knights fight <b>dragons</b>, like Saint George and the dragon."],
  [2,"🌊","What is the ditch filled with water around a castle called?","A moat",["A pond","A river","A puddle"],"A <b>moat</b> is a ditch of water around a castle that keeps enemies out."],
  [2,"🌉","What is the castle bridge that can be pulled up to keep enemies out?","A drawbridge",["A rope bridge","A tunnel","A slide"],"A <b>drawbridge</b> can be raised with chains so no one can cross the moat."],
  [2,"🤹","Who told jokes and juggled to make the king laugh?","The jester",["The knight","The squire","The blacksmith"],"<b>The jester</b> wore a funny hat with bells and told jokes."],
  [2,"🗡️","What weapon with a long metal blade did knights carry?","A sword",["A slingshot","A boomerang","A fishing pole"],"Knights carried a <b>sword</b>, plus a shield to block attacks."],
  [3,"🐎","What is the contest where two knights on horses charge at each other with long poles?","Jousting",["Fencing","Wrestling","Racing"],"That contest is <b>jousting</b>. The long poles are called lances."],
  [3,"🔨","Who made horseshoes, armor, and swords out of hot metal?","The blacksmith",["The baker","The jester","The king"],"<b>The blacksmith</b> heated metal in a fire and hammered it into shape."],
  [3,"🪨","Which legendary king pulled a sword out of a stone?","King Arthur",["King Roland","King George","King Midas"],"Young <b>King Arthur</b> pulled the sword from the stone, which proved he should be king."],
  [3,"⭕","What shape was the special table where King Arthur's knights sat?","Round",["Square","Triangle","Star"],"Arthur's knights sat at a <b>round</b> table, so no knight was more important than another."],
  [4,"🏰","What is the biggest, strongest tower in the middle of a castle called?","The keep",["The moat","The dungeon","The gatehouse"],"<b>The keep</b> was the safest place in the castle, where the lord's family lived."],
  [4,"🧑","What was a young man called who was training to be a knight and cared for a knight's armor and horse?","A squire",["A jester","A wizard","A peasant"],"A <b>squire</b> helped a knight and learned to fight. Later he could become a knight himself."],
  [4,"📜","What do we call the time in history of knights and castles, about 500 to 1,500 years ago?","The Middle Ages",["The Stone Age","The Ice Age","The Space Age"],"Knights and castles were part of <b>the Middle Ages</b>."],
  [4,"🎯","Which machine flung huge rocks at castle walls?","A catapult",["A seesaw","A windmill","A wheelbarrow"],"A <b>catapult</b> hurled big rocks to knock down castle walls."],
  [5,"⚔️","What was the name of King Arthur's magic sword?","Excalibur",["Sting","Glamdring","Lightbringer"],"King Arthur's sword was <b>Excalibur</b>. In some stories, the Lady of the Lake gave it to him."],
  [5,"🧙","Which wizard helped King Arthur?","Merlin",["Griffith","Gandalf","Dumbledore"],"<b>Merlin</b> was King Arthur's wise wizard."],
  [5,"🏹","Which legendary outlaw lived in Sherwood Forest and stole from the rich to give to the poor?","Robin Hood",["King Arthur","Sir Lancelot","Peter Pan"],"<b>Robin Hood</b> and his Merry Men lived in Sherwood Forest in England."],
  [5,"🔗","What was armor made of thousands of tiny linked metal rings called?","Chain mail",["Plate glass","Steel wool","Tin foil"],"<b>Chain mail</b> was made of thousands of little metal rings linked together."],
  [5,"🦁","Which English king was nicknamed “the Lionheart”?","Richard I",["Henry VIII","King John","William the Conqueror"],"<b>Richard I</b> was called Richard the Lionheart because he was such a bold warrior."],
 ]},
 { id: "world", name: "Around the World", emoji: "🌏", intro: "Pack your suitcase! We're going around the world.", qs: [
  [1,"🏳️","What do we call a piece of cloth with colors and shapes that stands for a country?","A flag",["A map","A coin","A stamp"],"Every country has its own <b>flag</b>."],
  [1,"🐻","Which big white bear lives near the North Pole?","A polar bear",["A panda","A grizzly bear","A koala"],"<b>Polar bears</b> live near the North Pole. Their fur helps them blend in with the snow."],
  [1,"👋","How do you say “hello” in Spanish?","Hola",["Bonjour","Ciao","Konnichiwa"],"<b>Hola</b> means hello in Spanish. Bonjour is French, and konnichiwa is Japanese."],
  [2,"🗼","In which city is the Eiffel Tower?","Paris",["London","New York","Rome"],"The Eiffel Tower is in <b>Paris</b>, France."],
  [2,"🐼","Giant pandas come from which country?","China",["Brazil","Canada","Egypt"],"Giant pandas come from the mountains of <b>China</b>. They eat bamboo almost all day!"],
  [2,"🍁","Which leaf is on the flag of Canada?","A maple leaf",["An oak leaf","A palm leaf","A clover"],"Canada's flag has a red <b>maple leaf</b>. Maple syrup comes from maple trees!"],
  [2,"🌮","What language do most people speak in Mexico?","Spanish",["English","French","Mexican"],"Most people in Mexico speak <b>Spanish</b>."],
  [3,"🔺","In which country are the Great Pyramids of Giza?","Egypt",["Mexico","Peru","India"],"The Great Pyramids are in <b>Egypt</b>. They are about 4,500 years old!"],
  [3,"🕰️","Big Ben is a famous clock tower in which city?","London",["Paris","Berlin","Dublin"],"Big Ben is in <b>London</b>, England."],
  [3,"👢","Which country is shaped like a boot?","Italy",["Spain","Greece","France"],"<b>Italy</b> is shaped like a boot kicking a ball, which is the island of Sicily."],
  [3,"🔴","Which country's flag is a red circle on a white background?","Japan",["China","Canada","Korea"],"<b>Japan</b>'s flag shows a red sun. Japan is called the Land of the Rising Sun."],
  [4,"🗽","Which country gave the Statue of Liberty to the United States?","France",["England","Spain","Italy"],"<b>France</b> gave the Statue of Liberty to the United States as a gift of friendship in 1886."],
  [4,"🌳","What is the biggest rain forest in the world?","The Amazon",["The Congo","Sherwood Forest","The Black Forest"],"<b>The Amazon</b> in South America is the biggest rain forest in the world."],
  [4,"🕌","The Taj Mahal is in which country?","India",["Egypt","China","Turkey"],"The Taj Mahal is in <b>India</b>. It's made of white marble."],
  [4,"🏟️","In which city is the Colosseum, where gladiators fought long ago?","Rome",["Athens","Paris","Cairo"],"The Colosseum is in <b>Rome</b>, Italy. It's almost 2,000 years old!"],
  [5,"🇧🇷","What language do most people in Brazil speak?","Portuguese",["Spanish","French","Brazilian"],"Most people in Brazil speak <b>Portuguese</b>. Most of the rest of South America speaks Spanish."],
  [5,"💶","What money do many countries in Europe share?","The euro",["The dollar","The pound","The yen"],"Many European countries share the <b>euro</b>, like France, Spain, and Italy."],
  [5,"🏔️","Which mountain range has Mount Everest?","The Himalayas",["The Alps","The Andes","The Rockies"],"Mount Everest is in <b>the Himalayas</b>, in Asia."],
  [5,"👨‍👩‍👧‍👦","Which country has the most people in the world?","India",["China","The United States","Russia"],"<b>India</b> has the most people. It passed China in 2023!"],
  [5,"🦙","Machu Picchu, an ancient city high in the mountains, is in which country?","Peru",["Mexico","Chile","Egypt"],"Machu Picchu is in <b>Peru</b>. The Inca people built it about 600 years ago."],
 ]},
 { id: "inventions", name: "Inventions", emoji: "💡", intro: "Let's meet the inventors who changed the world!", qs: [
  [1,"⚙️","Which round invention helps cars, bikes, and wagons roll?","The wheel",["The ladder","The hammer","The kite"],"<b>The wheel</b> is one of the most important inventions ever."],
  [1,"📞","What do we use to call and talk to someone far away?","A phone",["A toaster","A clock","A lamp"],"A <b>phone</b> lets you talk to people far away."],
  [1,"💡","What glows and gives light when you flip on the switch?","A light bulb",["A sponge","A pillow","A crayon"],"A <b>light bulb</b> glows when electricity flows through it."],
  [2,"🔭","Which invention lets you see faraway stars and planets?","A telescope",["A microscope","A magnifying glass","A kaleidoscope"],"A <b>telescope</b> makes faraway things in the sky look closer."],
  [2,"🚲","What has two wheels and pedals that you push with your feet?","A bicycle",["A wagon","A skateboard","A scooter"],"A <b>bicycle</b> has two wheels and pedals."],
  [2,"🧊","Which kitchen invention keeps food cold?","A refrigerator",["An oven","A toaster","A blender"],"A <b>refrigerator</b> keeps food cold so it stays fresh."],
  [2,"📺","Which invention shows moving pictures and shows in your living room?","A TV",["A radio","A microwave","A telephone"],"A <b>TV</b> shows moving pictures. Families started getting TVs about 75 years ago."],
  [3,"🔬","Which invention lets you see tiny germs and cells?","A microscope",["A telescope","A stethoscope","A periscope"],"A <b>microscope</b> makes tiny things look huge, like germs and cells."],
  [3,"💡","Who is famous for making the first long-lasting light bulb?","Thomas Edison",["Benjamin Franklin","Albert Einstein","Henry Ford"],"<b>Thomas Edison</b> made a light bulb that lasted a long time. He had over 1,000 inventions!"],
  [3,"🪁","Which American flew a kite in a storm to learn about electricity?","Benjamin Franklin",["Thomas Edison","George Washington","Abraham Lincoln"],"<b>Benjamin Franklin</b> flew a kite in a storm to show lightning is electricity. Don't try it!"],
  [3,"🧭","Which tool has a magnetic needle that always points north?","A compass",["A clock","A ruler","A thermometer"],"A <b>compass</b> needle always points north, so explorers could find their way."],
  [4,"☎️","Who invented the telephone?","Alexander Graham Bell",["Thomas Edison","Henry Ford","Steve Jobs"],"<b>Alexander Graham Bell</b> made the first telephone call in 1876."],
  [4,"🚗","Who used an assembly line to make cars cheap enough for lots of families?","Henry Ford",["Thomas Edison","The Wright brothers","Walt Disney"],"<b>Henry Ford</b> used an assembly line to build his Model T cars fast and cheap."],
  [4,"🎆","Paper, fireworks, and the compass were first invented in which country?","China",["Egypt","Italy","England"],"Paper, fireworks, and the compass were all invented in <b>China</b> long ago."],
  [4,"🌐","What is the giant network that connects computers all over the world called?","The Internet",["The radio","The phone book","The satellite"],"<b>The Internet</b> connects computers all over the world."],
  [5,"📖","Which invention by Johannes Gutenberg made it easy to make lots of copies of books?","The printing press",["The typewriter","The camera","The pencil"],"Gutenberg's <b>printing press</b>, from the 1400s, made books much cheaper and easier to make."],
  [5,"🦠","Which scientist discovered penicillin, a germ-fighting medicine, when mold grew in his lab?","Alexander Fleming",["Louis Pasteur","Marie Curie","Isaac Newton"],"<b>Alexander Fleming</b> noticed mold killing germs in 1928. That led to penicillin."],
  [5,"🥜","Which scientist found hundreds of new uses for peanuts?","George Washington Carver",["Booker T. Washington","Thomas Edison","Benjamin Franklin"],"<b>George Washington Carver</b> found hundreds of uses for peanuts and helped farmers grow better crops."],
  [5,"🏅","Who was the first woman to win a Nobel Prize?","Marie Curie",["Jane Goodall","Ada Lovelace","Amelia Earhart"],"<b>Marie Curie</b> won the Nobel Prize twice for her science about radioactivity."],
  [5,"🔌","Which inventor, who has an electric car company named after him, worked on the kind of electricity in our homes?","Nikola Tesla",["Elon Musk","Thomas Edison","Henry Ford"],"<b>Nikola Tesla</b> helped bring alternating current (AC) electricity to homes. Tesla cars are named after him."],
 ]},
 { id: "holidays", name: "Holidays", emoji: "🎉", intro: "Let's celebrate! It's time for holidays all year long.", qs: [
  [1,"🎃","On which holiday do kids dress up in costumes and go trick-or-treating?","Halloween",["Thanksgiving","Easter","Christmas"],"Kids go trick-or-treating on <b>Halloween</b>, October 31."],
  [1,"🎅","Who brings presents on Christmas Eve in a sleigh pulled by reindeer?","Santa Claus",["The Easter Bunny","The Tooth Fairy","Cupid"],"<b>Santa Claus</b> rides his sleigh on Christmas Eve."],
  [1,"💌","Which shape do you see on lots of Valentine's Day cards?","A heart",["A star","A square","A triangle"],"Valentine's Day is full of <b>hearts</b>, for love and friendship."],
  [2,"🐰","Who hides eggs for kids to find at Easter?","The Easter Bunny",["Santa Claus","The Tooth Fairy","A leprechaun"],"<b>The Easter Bunny</b> hides eggs for kids to find."],
  [2,"☘️","On St. Patrick's Day, which color do people wear?","Green",["Orange","Purple","Pink"],"People wear <b>green</b> on St. Patrick's Day, the color of Ireland."],
  [2,"🎆","What lights up the sky on the Fourth of July?","Fireworks",["Rainbows","Comets","Balloons"],"<b>Fireworks</b> light up the sky to celebrate America's birthday."],
  [2,"🦌","Which of Santa's reindeer has a shiny red nose?","Rudolph",["Dasher","Blitzen","Comet"],"<b>Rudolph</b> has a shiny red nose that lights the way for Santa's sleigh."],
  [3,"🕎","Which Jewish holiday is celebrated by lighting candles on a menorah for eight nights?","Hanukkah",["Passover","Kwanzaa","Diwali"],"<b>Hanukkah</b> lasts eight nights. One more candle is lit each night."],
  [3,"🐿️","On Groundhog Day, what does it mean if the groundhog sees its shadow?","Six more weeks of winter",["Spring comes early","It will snow all day","No school tomorrow"],"If the groundhog sees its shadow, legend says there will be <b>six more weeks of winter</b>."],
  [3,"🌈","Which tiny Irish fairy is said to hide a pot of gold at the end of the rainbow?","A leprechaun",["An elf","A gnome","A troll"],"A <b>leprechaun</b> hides his pot of gold at the end of the rainbow, or so the story goes!"],
  [3,"🎊","Which holiday is on January 1st?","New Year's Day",["Valentine's Day","Earth Day","Labor Day"],"<b>New Year's Day</b> is January 1st, the first day of the year."],
  [4,"🧧","Which holiday is celebrated with dragon dances, red envelopes, and a new animal each year?","Lunar New Year",["Diwali","Cinco de Mayo","Mardi Gras"],"<b>Lunar New Year</b> has dragon dances and red envelopes with money inside. Each year has a zodiac animal."],
  [4,"🎖️","Which November holiday honors people who served in the military?","Veterans Day",["Labor Day","Presidents' Day","Flag Day"],"<b>Veterans Day</b> is November 11. It thanks everyone who served in the military."],
  [4,"🌍","Which day in April is all about taking care of our planet?","Earth Day",["Labor Day","Groundhog Day","Leap Day"],"<b>Earth Day</b> is April 22. People plant trees and clean up trash."],
  [4,"✊","Which January holiday honors a famous civil rights leader?","Martin Luther King Jr. Day",["Presidents' Day","Veterans Day","Labor Day"],"<b>Martin Luther King Jr. Day</b> is in January, near his birthday."],
  [5,"🪔","Which Hindu holiday is known for rows of little lamps and fireworks?","Diwali",["Kwanzaa","Lunar New Year","Mardi Gras"],"<b>Diwali</b> is a Hindu festival of lights, with little oil lamps, sweets, and fireworks."],
  [5,"🕯️","Which holiday, from December 26 to January 1, celebrates African American culture?","Kwanzaa",["Hanukkah","Diwali","Juneteenth"],"<b>Kwanzaa</b> lasts seven days. A candle is lit each day for a different idea, like unity."],
  [5,"🇲🇽","Cinco de Mayo remembers a battle won by which country?","Mexico",["Spain","France","The United States"],"Cinco de Mayo remembers when <b>Mexico</b> beat the French army in 1862."],
  [5,"🎄","Which country started the tradition of the Christmas tree?","Germany",["Canada","Italy","Norway"],"Christmas trees started in <b>Germany</b> hundreds of years ago."],
  [5,"🎉","Juneteenth celebrates the end of what in the United States?","Slavery",["The school year","Winter","The Revolutionary War"],"Juneteenth celebrates the end of <b>slavery</b>. On June 19, 1865, enslaved people in Texas learned they were free."],
 ]},
 { id: "vehicles", name: "Things That Go", emoji: "🚂", intro: "Start your engines! Let's learn about things that go.", qs: [
  [1,"🚒","What color is a fire truck usually?","Red",["Blue","Green","Purple"],"Most fire trucks are <b>red</b>, so everyone can see them coming."],
  [1,"🚌","Which big yellow vehicle takes kids to school?","A school bus",["A taxi","A tractor","A boat"],"A yellow <b>school bus</b> takes kids to school."],
  [1,"🚂","Which vehicle rides on tracks and goes “choo choo”?","A train",["A bus","A boat","A helicopter"],"A <b>train</b> rides on tracks. Choo choo!"],
  [2,"🚁","Which flying vehicle has spinning blades on top and can hover in one spot?","A helicopter",["A blimp","A rocket","A glider"],"A <b>helicopter</b> can fly straight up and hover in one spot."],
  [2,"🚦","On a traffic light, which color means go?","Green",["Red","Yellow","Blue"],"<b>Green</b> means go, yellow means slow down, and red means stop."],
  [2,"🚜","Which farm vehicle pulls plows and wagons?","A tractor",["A race car","A limousine","An ambulance"],"A <b>tractor</b> pulls heavy things on the farm."],
  [2,"🚑","Which vehicle rushes sick or hurt people to the hospital?","An ambulance",["A garbage truck","A taxi","A tractor"],"An <b>ambulance</b> rushes people to the hospital with its siren on."],
  [3,"⛽","Most cars burn what to make them go?","Gasoline",["Water","Milk","Juice"],"Most cars burn <b>gasoline</b>. Electric cars run on big batteries instead."],
  [3,"🌊","What do we call a boat that can travel underwater?","A submarine",["A canoe","A sailboat","A ferry"],"A <b>submarine</b> can dive deep underwater."],
  [3,"⛵","What pushes a sailboat across the water?","The wind",["A motor","Paddles","Fish"],"<b>The wind</b> fills the sails and pushes the boat along."],
  [3,"🎈","Which flying thing floats because the air inside it is heated?","A hot air balloon",["A helicopter","A kite","A jet"],"A <b>hot air balloon</b> rises because hot air is lighter than cool air."],
  [4,"🚢","What is the front of a ship called?","The bow",["The stern","The deck","The mast"],"The front of a ship is <b>the bow</b>. The back is the stern."],
  [4,"⚓","What heavy hook does a ship drop to the bottom so it won't drift away?","An anchor",["A mast","A rudder","A sail"],"A ship drops its <b>anchor</b> to stay in one place."],
  [4,"🚂","What did old steam trains usually burn to make steam?","Coal",["Gasoline","Batteries","Ice"],"Steam trains burned <b>coal</b> to boil water and make steam."],
  [4,"🌕","What were the NASA missions that landed astronauts on the Moon called?","Apollo",["Gemini","Voyager","Mercury"],"The <b>Apollo</b> missions landed astronauts on the Moon, starting in 1969."],
  [5,"🚄","What are Japan's super fast bullet trains called?","Shinkansen",["Amtrak","The Orient Express","The Polar Express"],"Japan's bullet trains are called <b>Shinkansen</b>. They can go about 200 miles per hour!"],
  [5,"🤖","Which NASA rover landed on Mars in 2021?","Perseverance",["Curiosity","Voyager","Apollo"],"<b>Perseverance</b> landed on Mars in 2021. It even brought a little helicopter named Ingenuity!"],
  [5,"🧊","Which famous ship sank in 1912 after hitting an iceberg?","The Titanic",["The Mayflower","The Lusitania","The Santa María"],"<b>The Titanic</b> sank on its very first trip, in 1912."],
  [5,"✈️","What was the name of the Wright brothers' first airplane?","The Wright Flyer",["The Spirit of St. Louis","Air Force One","The Kitty Hawk"],"Their plane was <b>the Wright Flyer</b>. It first flew in 1903 near Kitty Hawk, North Carolina."],
  [5,"🛩️","Who was the first woman to fly an airplane alone across the Atlantic Ocean?","Amelia Earhart",["Sally Ride","Bessie Coleman","Harriet Quimby"],"<b>Amelia Earhart</b> flew alone across the Atlantic in 1932."],
 ]},
 { id: "dragonmasters", group: "fun", name: "Dragon Masters", emoji: "🐉", intro: "Calling all Dragon Masters! Let's visit King Roland's castle.", qs: [
  [1, "🐉", "In Dragon Masters, what is the name of Drake's dragon?", "Worm", ["Vulcan", "Shu", "Kepri"], "Drake's dragon is named <b>Worm</b>. He is an Earth Dragon!"],
  [1, "🔥", "What kind of dragon is Vulcan, Rori's dragon?", "A Fire Dragon", ["A Water Dragon", "An Ice Dragon", "A Moon Dragon"], "Rori's dragon, Vulcan, is a <b>Fire Dragon</b>."],
  [2, "💧", "Which Dragon Master's dragon is Shu, the Water Dragon?", "Bo", ["Drake", "Rori", "Ana"], "<b>Bo</b> is the Dragon Master of Shu, the Water Dragon."],
  [2, "☀️", "What kind of dragon is Kepri, Ana's dragon?", "A Sun Dragon", ["A Fire Dragon", "A Lightning Dragon", "An Earth Dragon"], "Ana's dragon, Kepri, is a <b>Sun Dragon</b>."],
  [2, "🧙", "What is the name of the wizard who teaches the Dragon Masters?", "Griffith", ["Maldred", "Merlin", "Roland"], "<b>Griffith</b> is the royal wizard. He helps the Dragon Masters learn their dragons' powers."],
  [3, "👑", "Which king do the Dragon Masters work for?", "King Roland", ["King Arthur", "King Griffith", "King Bo"], "The Dragon Masters live and train at the castle of <b>King Roland</b>."],

  [3, "🏰", "What is the name of the kingdom where the Dragon Masters live?", "Bracken", ["Narnia", "Camelot", "Frog Creek"], "The Dragon Masters live in the Kingdom of <b>Bracken</b>."],
  [4, "🐍", "Petra's dragon is a Hydra with four heads. What kind of dragon is it?", "A Poison Dragon", ["An Ice Dragon", "A Gold Dragon", "A Wind Dragon"], "Petra's four-headed Hydra is a <b>Poison Dragon</b>. Its song can cure poison!"],
  [4, "⚡", "In “Search for the Lightning Dragon,” who is the Lightning Dragon's Dragon Master?", "Carlos", ["Petra", "Mina", "Drake"], "A boy named <b>Carlos</b> is the Dragon Master of the Lightning Dragon."],
  [4, "❄️", "In “Chill of the Ice Dragon,” what froze Mina's homeland?", "An Ice Giant", ["A Snow Dragon", "A blizzard spell", "A frozen lake"], "Mina's homeland was frozen by an <b>Ice Giant</b>. Only a fire dragon could help!"],
  [5, "🌋", "Which evil wizard stole the gold and silver keys to free Naga, the Earthquake Dragon?", "Maldred", ["Griffith", "Roland", "Carlos"], "The evil wizard <b>Maldred</b> stole the keys to free Naga, the Earthquake Dragon."],
  [5, "📚", "What is the very first Dragon Masters book called?", "Rise of the Earth Dragon", ["Saving the Sun Dragon", "Power of the Fire Dragon", "Curse of the Shadow Dragon"], "The first book is <b>Rise of the Earth Dragon</b>."],
  [5, "🔺", "In “Flight of the Moon Dragon,” where do the Dragon Masters travel?", "The Land of Pyramids", ["The Frozen North", "Under the sea", "The Moon"], "They travel to the <b>Land of Pyramids</b> to find the hidden Pyramid of the Seven Dragons."],
  [5, "💠", "In “Cave of the Crystal Dragon,” who do Drake and his friends rescue from a cave?", "Griffith", ["King Roland", "Petra", "Maldred"], "Drake and his friends rescue <b>Griffith</b> the wizard from a cave."],
 ]},
 { id: "galaxyzack", group: "fun", name: "Galaxy Zack", emoji: "🛸", intro: "Blast off to the planet Nebulon with Zack!", qs: [
  [1, "🪐", "What planet does Zack Nelson move to?", "Nebulon", ["Mars", "Saturn", "Pluto"], "Zack's family moves from Earth to the planet <b>Nebulon</b>."],
  [1, "🐶", "What is the name of Zack's dog?", "Luna", ["Rocky", "Sparky", "Max"], "Zack's dog is named <b>Luna</b>."],
  [2, "🌎", "Which planet did Zack live on before he moved?", "Earth", ["Nebulon", "Jupiter", "Venus"], "Zack and his family lived on <b>Earth</b> before moving to Nebulon."],
  [2, "🏫", "What is the name of Zack's new school?", "Sprockets Academy", ["Rocket Elementary", "Star School", "Galaxy High"], "Zack goes to <b>Sprockets Academy</b>."],
  [2, "🧒", "Who is Zack's best friend on Nebulon?", "Drake", ["Bert", "Rip", "Jack"], "<b>Drake</b> is Zack's best friend on Nebulon. He helped Zack on his first day of school."],
  [3, "🤖", "What runs the house where Zack lives on Nebulon?", "A computer called the I.R.A.", ["A robot butler named Bob", "A talking dog", "Zack's sisters"], "A computer system called the <b>I.R.A.</b> runs Zack's house."],
  [3, "👩‍🏫", "Who is Zack's teacher at Sprockets Academy?", "Ms. Rudolph", ["Ms. Frizzle", "Mrs. Puff", "Ms. Nelson"], "Zack's teacher is <b>Ms. Rudolph</b>."],
  [3, "💼", "Why did Zack's family move to Nebulon?", "His dad got a new job", ["They won a contest", "Earth ran out of pizza", "To find Luna"], "The Nelsons moved because <b>Zack's dad got a new job</b> on Nebulon."],
  [4, "📅", "In what year does Zack move to Nebulon?", "2120", ["2020", "1999", "3000"], "Zack's story takes place in the year <b>2120</b>."],
  [4, "👯", "Who else is in Zack's family besides his mom and dad?", "Twin sisters", ["Three brothers", "A baby brother", "A grandpa"], "Zack has <b>twin sisters</b>."],
  [5, "🔤", "What does I.R.A. stand for?", "Indoor Robotic Assistant", ["Interstellar Rocket Alarm", "Ice Robot Army", "Inside Room Assistant"], "I.R.A. stands for <b>Indoor Robotic Assistant</b>."],
  [5, "🏠", "In “Return to Earth!,” what goes wrong on Zack's trip back to Earth?", "Luna goes missing", ["Zack forgets how to fly", "Drake gets lost", "The I.R.A. breaks"], "On the trip back to Earth, <b>Luna goes missing</b> and Zack has to find her."],
  [5, "👥", "In “Three's a Crowd!,” which friend of Zack's meets Drake?", "Bert", ["Rip", "Carlos", "Jack"], "In “Three's a Crowd!,” Zack's friend <b>Bert</b> meets Drake."],
 ]},
 { id: "treehouse", group: "fun", name: "Magic Tree House", emoji: "🌳", intro: "Climb up the ladder! The magic tree house is ready to go.", qs: [
  [1, "🌳", "What are the names of the brother and sister in Magic Tree House?", "Jack and Annie", ["Hansel and Gretel", "Drake and Ana", "Rip and Nikki"], "The brother and sister are <b>Jack and Annie</b>."],
  [1, "🦕", "In “Dinosaurs Before Dark,” where does the tree house take Jack and Annie?", "The time of the dinosaurs", ["The Moon", "A pirate ship", "Ancient Egypt"], "In the first book, the tree house takes them back to <b>the time of the dinosaurs</b>."],
  [2, "🏡", "What town do Jack and Annie live in?", "Frog Creek", ["Stermont", "Bracken", "Nebulon"], "Jack and Annie live in <b>Frog Creek</b>, Pennsylvania."],
  [2, "👧", "Who is older, Jack or Annie?", "Jack", ["Annie", "They are twins", "Morgan"], "<b>Jack</b> is Annie's older brother."],
  [2, "📓", "What does Jack carry so he can write down facts?", "A notebook", ["A map", "A sword", "A telescope"], "Jack always carries a <b>notebook</b> to write down facts."],
  [3, "🦅", "In “Dinosaurs Before Dark,” which flying reptile carries Jack to safety?", "A Pteranodon", ["A Velociraptor", "A T. rex", "A dragon"], "A <b>Pteranodon</b> swoops in and flies Jack to safety. Annie names it Henry!"],
  [3, "🏅", "What letter is on the gold medallion Jack finds in the first book?", "M", ["J", "A", "T"], "Jack finds a gold medallion with the letter <b>M</b> on it. M is for Morgan!"],
  [3, "🏰", "In “The Knight at Dawn,” where do Jack and Annie go?", "A castle long ago", ["A pyramid", "A pirate ship", "A space station"], "In “The Knight at Dawn,” they visit <b>a castle long ago</b> and meet a knight."],
  [4, "🧙‍♀️", "Who does the magic tree house belong to?", "Morgan le Fay", ["Merlin", "Ms. Rudolph", "Griffith"], "The tree house belongs to <b>Morgan le Fay</b>, a magical librarian."],
  [4, "🐫", "In “Mummies in the Morning,” which ancient land do Jack and Annie visit?", "Ancient Egypt", ["Ancient Rome", "Ancient China", "Ancient Greece"], "In “Mummies in the Morning,” they visit <b>ancient Egypt</b> and explore a pyramid."],
  [4, "🏴‍☠️", "In “Pirates Past Noon,” what do the pirates want?", "Buried treasure", ["A lost dog", "A dinosaur egg", "A magic wand"], "The pirates want Jack and Annie to help them find <b>buried treasure</b>."],
  [5, "📖", "How do Jack and Annie make the tree house take them somewhere?", "Point at a picture in a book and wish", ["Say a magic word", "Ring a bell", "Climb down backward"], "They <b>point at a picture in a book and wish</b> to go there!"],
  [5, "🥷", "What is Magic Tree House book #5 about?", "Ninjas", ["Mermaids", "Robots", "Cowboys"], "Book #5 is “Night of the <b>Ninjas</b>.”"],
  [3,"🌴","In “Afternoon on the Amazon,” what kind of place do Jack and Annie visit?","A rain forest",["A desert","The North Pole","A coral reef"],"In “Afternoon on the Amazon,” Jack and Annie visit <b>a rain forest</b> full of army ants and piranhas."],
  [4,"🦣","In “Sunset of the Sabertooth,” which time do Jack and Annie travel to?","The Ice Age",["The time of dinosaurs","Ancient Rome","The Wild West"],"In “Sunset of the Sabertooth,” Jack and Annie travel to <b>the Ice Age</b>."],
  [5,"🏰","Morgan le Fay is a magical librarian from which legendary kingdom?","Camelot",["Narnia","Bracken","Oz"],"Morgan le Fay comes from <b>Camelot</b>, King Arthur's kingdom."],
  [5,"🌋","In “Vacation Under the Volcano,” which ancient Roman town do Jack and Annie visit?","Pompeii",["Athens","Cairo","Venice"],"Jack and Annie visit <b>Pompeii</b>, the town buried when the volcano Mount Vesuvius erupted."],
 ]},
 { id: "binderofdoom", group: "fun", name: "Binder of Doom", emoji: "👾", intro: "Shhh! It's time for the Super Secret Monster Patrol.", qs: [
  [1, "👾", "What does the Super Secret Monster Patrol protect their town from?", "Monsters", ["Pirates", "Dinosaurs", "Aliens"], "The Super Secret Monster Patrol protects their town from <b>monsters</b>!"],
  [1, "🧑", "Who is the leader of the Super Secret Monster Patrol?", "Alexander Bopp", ["Zack Nelson", "Jack", "Drake"], "<b>Alexander Bopp</b> leads the Super Secret Monster Patrol."],
  [2, "🏘️", "What town do Alexander and his friends live in?", "Stermont", ["Frog Creek", "Bracken", "Adventure Bay"], "Alexander and his friends live in <b>Stermont</b>."],
  [2, "👫", "Who are Alexander's two friends in the Monster Patrol?", "Rip and Nikki", ["Jack and Annie", "Bo and Ana", "Drake and Bert"], "<b>Rip and Nikki</b> are in the Super Secret Monster Patrol with Alexander."],
  [3, "🎂", "What is the first Binder of Doom book called?", "Brute-Cake", ["Boa Constructor", "Speedah-Cheetah", "Hydrant-Hydra"], "The first book is <b>Brute-Cake</b>. Alexander keeps finding cake crumbs around town!"],
  [3, "🏎️", "In “Speedah-Cheetah,” what do Alexander, Nikki, and Rip build for the Stermont Derby?", "Race cars", ["Robots", "Kites", "Tree houses"], "They build <b>race cars</b> for the Stermont Derby, but a speedy monster wants to race too!"],

 { id: "dinoexperts", group: "fun", name: "Dino Experts", emoji: "🦴", intro: "Only for real dinosaur experts. These are tough!", qs: [
  [2, "🦕", "Which dinosaur's name means “three-horned face”?", "Triceratops", ["Stegosaurus", "Pachycephalosaurus", "Allosaurus"], "<b>Triceratops</b> means “three-horned face.”"],
  [3, "🦖", "What does “Tyrannosaurus rex” mean?", "Tyrant lizard king", ["Terrible lizard", "Speedy thief", "Big tooth"], "Tyrannosaurus rex means <b>tyrant lizard king</b>."],
  [3, "🦃", "What does “Velociraptor” mean?", "Speedy thief", ["Tyrant king", "Roof lizard", "Big claw"], "Velociraptor means <b>speedy thief</b>. Real ones were about the size of a turkey and had feathers!"],
  [3, "🦅", "Was the Pteranodon a dinosaur?", "No, it was a flying reptile", ["Yes, a flying dinosaur", "No, it was a bird", "Yes, the fastest one"], "<b>No, it was a flying reptile</b>. Pterosaurs were cousins of the dinosaurs."],
  [3, "⏳", "What are the three periods of the dinosaur age, in order?", "Triassic, Jurassic, Cretaceous", ["Jurassic, Triassic, Cretaceous", "Cretaceous, Jurassic, Triassic", "Stone Age, Bronze Age, Iron Age"], "The dinosaur age goes <b>Triassic, Jurassic, Cretaceous</b>."],
  [4, "🐊", "Which giant meat-eater had a tall sail on its back and hunted fish?", "Spinosaurus", ["Allosaurus", "Iguanodon", "Ankylosaurus"], "<b>Spinosaurus</b> had a tall sail on its back and hunted fish. It was even longer than T. rex!"],
  [4, "🔨", "Which armored dinosaur had a big bony club on the end of its tail?", "Ankylosaurus", ["Stegosaurus", "Parasaurolophus", "Diplodocus"], "<b>Ankylosaurus</b> was covered in armor and swung a bony tail club."],
  [4, "🎺", "Which duck-billed dinosaur had a long, hollow head crest that may have made trumpet sounds?", "Parasaurolophus", ["Triceratops", "Velociraptor", "Brachiosaurus"], "<b>Parasaurolophus</b> may have blown air through its crest to make loud honking sounds."],
  [4, "🌊", "Was the Mosasaurus a dinosaur?", "No, it was a sea reptile", ["Yes, a swimming dinosaur", "No, it was a fish", "Yes, the biggest one"], "<b>No, it was a sea reptile</b>. Mosasaurs swam in the oceans while dinosaurs walked on land."],
  [4, "🦴", "In which period did T. rex live?", "The Cretaceous", ["The Triassic", "The Jurassic", "The Ice Age"], "T. rex lived in <b>the Cretaceous</b>, the last period of the dinosaur age."],
  [5, "🗡️", "What is a “thagomizer”?", "The spikes on a Stegosaurus's tail", ["A dinosaur's tooth", "A fossil-digging tool", "A baby dinosaur"], "A thagomizer is <b>the spikes on a Stegosaurus's tail</b>."],
  [5, "🥚", "Which dinosaur's name means “good mother lizard” because it cared for its babies?", "Maiasaura", ["Oviraptor", "Microraptor", "Coelophysis"], "<b>Maiasaura</b> means “good mother lizard.” Scientists found its nests full of babies."],
  [5, "🌍", "When the first dinosaurs lived, all the land was one giant supercontinent. What was it called?", "Pangaea", ["Atlantis", "Antarctica", "Australia"], "All the land was joined in one supercontinent called <b>Pangaea</b>."],
  [5, "🐦", "Which famous fossil animal had feathers and wings like a bird, but teeth like a dinosaur?", "Archaeopteryx", ["Pterodactyl", "Dodo", "Dimetrodon"], "<b>Archaeopteryx</b> was part bird, part dinosaur, with feathers and sharp teeth."],
  [5, "🦕", "Which South American giant is one of the biggest dinosaurs ever found?", "Argentinosaurus", ["Compsognathus", "Velociraptor", "Iguanodon"], "<b>Argentinosaurus</b> was one of the biggest animals ever to walk on land."],
  [5, "☄️", "About how long ago did the dinosaurs (except birds) die out?", "66 million years ago", ["6,000 years ago", "1 million years ago", "1 billion years ago"], "The dinosaurs died out about <b>66 million years ago</b>."],
  [4,"🦕","What do we call the giant long-necked plant-eaters, like Brachiosaurus?","Sauropods",["Theropods","Raptors","Hadrosaurs"],"The long-necked giants are called <b>sauropods</b>. They were the biggest land animals ever."],
  [5,"🦖","What do we call the group of meat-eating dinosaurs that walked on two legs, like T. rex?","Theropods",["Sauropods","Ceratopsians","Stegosaurs"],"T. rex, Velociraptor, and Spinosaurus were <b>theropods</b>. Birds are theropods too!"],
  [5,"🏠","What does the name “Stegosaurus” mean?","Roof lizard",["Spiky lizard","Plated king","Tail fighter"],"Stegosaurus means <b>roof lizard</b>. Scientists first thought its plates lay flat like roof tiles."],
  [5,"🕊️","Which small dinosaur had feathered wings on both its arms and its legs?","Microraptor",["Archaeopteryx","Velociraptor","Compsognathus"],"<b>Microraptor</b> had four feathered wings and could glide from tree to tree."],
  [5,"👑","Which horned dinosaur had a frill with long spikes sticking out around it?","Styracosaurus",["Triceratops","Pachycephalosaurus","Ankylosaurus"],"<b>Styracosaurus</b> had a big nose horn and long spikes all around its frill."],
  [5,"🦴","What is the name of the famous T. rex fossil in Chicago, named after the woman who found it?","Sue",["Stan","Rexy","Big John"],"<b>Sue</b> is one of the most complete T. rex fossils ever found. She was named after Sue Hendrickson."],
 ]},

const plain = (s) => s.replace(/<[^>]+>/g, "");
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* Kid question by key ("catId-index") and grown-up question by key ("Section-index"). */
function qk(key) {
  const cut = key.lastIndexOf("-"), catId = key.slice(0, cut), idx = +key.slice(cut + 1);
  const cat = BANK.find((c) => c.id === catId);
  const [g, e, text, a, w, f] = cat.qs[idx];
  return { cat, g, e, text, a, w, f, key };
}
function gk(key) {
  const cut = key.lastIndexOf("-"), sec = key.slice(0, cut);
  const [text, a] = GROWN[sec][+key.slice(cut + 1)];
  return { sec, text, a, key };
}
/* A board column's topic: a kid category in the normal game, a shared topic in the Family game. */
const catById = (id) => BANK.find((c) => c.id === id) || FAMILY.find((c) => c.id === id);

const kidCands = (ids) => (ids.includes("*") ? BANK : BANK.filter((c) => ids.includes(c.id)))
  .flatMap((cat) => cat.qs.map((item, i) => ({ k: cat.id + "-" + i, g: item[0], a: item[3].toLowerCase() })));

/* How long ago a kid question was played: 0 = never, up to 1 = most recent. bb-seen is kept oldest first. */
function seenAge() {
  const m = new Map(), list = [...seen];
  list.forEach((k, i) => m.set(k, (i + 1) / list.length));
  return m;
}

/* Pick n kid questions, easiest to hardest, spread across the grade range. Skips keys in `used`.
   Unplayed questions come first (even one grade off), then the ones played longest ago. */
function pickClues(cands, range, used, n = 5) {
  const [lo, hi] = range;
  const taken = new Set(), answers = new Set(), age = seenAge();
  const out = [];
  for (let i = 0; i < n; i++) {
    const target = n === 1 ? hi : lo + (hi - lo) * (i / (n - 1));
    let best = null, bestScore = Infinity;
    cands.forEach((c) => {
      if (taken.has(c.k) || used.has(c.k) || answers.has(c.a)) return;
      const score = Math.abs(c.g - target) + (age.has(c.k) ? 1.25 + age.get(c.k) : 0) + Math.random() * 0.2;
      if (score < bestScore) { bestScore = score; best = c; }
    });
    if (!best) break;
    taken.add(best.k); answers.add(best.a);
    out.push(best);
  }
  out.sort((a, b) => a.g - b.g);
  out.forEach((c) => used.add(c.k));
  return out.map((c) => c.k);
}
/* Pick n grown-up questions for a Family topic, easiest to hardest. Each clue has a difficulty from 1 to 5:
   the 100 square aims for 1 and the 500 square for 5 (a single Final question aims for 5). Unseen clues come first. */
function pickGrown(fam, used, n = 5) {
  const cands = fam.grown.flatMap((sec) => (GROWN[sec] || []).map((q, i) => ({ k: sec + "-" + i, g: q[2] || 3, a: q[1].toLowerCase() }))).filter((c) => !used.has(c.k));
  const taken = new Set(), answers = new Set(), out = []; // no two clues with the same answer in a column
  for (let i = 0; i < n; i++) {
    const target = n === 1 ? 5 : 1 + (4 * i) / (n - 1);
    let best = null, bestScore = Infinity;
    cands.forEach((c) => {
      if (taken.has(c.k) || answers.has(c.a)) return;
      const score = Math.abs(c.g - target) + (grownSeen.has(c.k) ? 1 : 0) + Math.random() * 0.4;
      if (score < bestScore) { bestScore = score; best = c; }
    });
    if (!best) break;
    taken.add(best.k); answers.add(best.a); out.push(best);
  }
  out.sort((a, b) => a.g - b.g);
  out.forEach((c) => used.add(c.k));
  return out.map((c) => c.k);
}

const gameLevel = () => LEVELS.find((l) => l.id === prefs.level) || LEVELS[3];
const fitsTopics = (c) => prefs.topics === "mix" || (prefs.topics === "fun") === (c.group === "fun");

/* Five topics that haven't been used yet this game. Mix = at least 2 of each kind. */
function chooseCats(usedIds, family) {
  if (family) return shuffle(FAMILY.filter((c) => !usedIds.includes(c.id))).slice(0, 5);
  const avail = BANK.filter((c) => !usedIds.includes(c.id) && fitsTopics(c));
  if (prefs.topics !== "mix") return shuffle(avail).slice(0, 5);
  const school = shuffle(avail.filter((c) => c.group !== "fun"));
  const fun = shuffle(avail.filter((c) => c.group === "fun"));
  const rest = shuffle(school.slice(2).concat(fun.slice(2)));
  return shuffle(school.slice(0, 2).concat(fun.slice(0, 2), rest[0]));
}
/* Every square holds a kid question (k). In the Family game it also holds a grown-up one (p). */
function buildCols(cats, mult, family, used) {
  return cats.map((cat) => {
    const kids = pickClues(kidCands(family ? cat.kids : [cat.id]), gameLevel().range, used);
    const grown = family ? pickGrown(cat, used) : [];
    return { cat: cat.id, clues: kids.map((k, r) => ({ k, p: grown[r] || null, value: VALUES[r] * mult, done: false, ok: null })) };
  });
}
/* Keys already on a board or in the final, so nothing repeats within a game. */
function usedKeys() {
  const u = new Set();
  S.past.concat(S.cols).forEach((col) => col.clues.forEach((cl) => { u.add(cl.k); if (cl.p) u.add(cl.p); }));
  u.add(S.final.k); if (S.final.p) u.add(S.final.p);
  return u;
}
/* Daily Double squares go in different columns, never in the top (easiest) row. */
function placeStars(n) {
  return shuffle([0, 1, 2, 3, 4]).slice(0, n).map((c) => ({ c, r: 1 + Math.floor(Math.random() * 4) }));
}

function newGame() {
  const level = gameLevel();
  const family = !!prefs.family && prefs.count >= 2;
  const used = new Set();
  const boardCats = chooseCats([], family);
  // Final question: a topic not on the board, hardest kid question for the chosen grades
  const finalCat = pick(family ? FAMILY.filter((c) => !boardCats.includes(c)) : BANK.filter((c) => !boardCats.includes(c) && fitsTopics(c)));
  const cols = buildCols(boardCats, 1, family, used);
  const fk = pickClues(kidCands(family ? finalCat.kids : [finalCat.id]), [level.range[1], level.range[1]], used, 1)[0];
  const fp = family ? pickGrown(finalCat, used, 1)[0] : null;
  S = {
    screen: "lesson",
    family,
    penalty: penaltySetting(),
    say: prefs.answers === "say",
    round: 1,
    players: prefs.names.slice(0, prefs.count).map((n, i) => ({ name: (n || "").trim() || DEFAULT_NAMES[i], score: 0, role: family ? prefs.roles[i] || "kid" : "kid" }))
      .concat(prefs.bot && !family ? [{ name: BOT_NAME, score: 0, bot: true }] : []),
    cols,
    past: [],
    stars: placeStars(1),
    turn: 0,
    lessonIdx: 0,
    final: { cat: finalCat.id, k: fk, p: fp, step: 0, player: 0, wagers: [], answers: [] },
  };
}

/* Double Jeopardy: new topics, double values, two Daily Double squares. Lowest score picks first. */
function startDoubleRound() {
  const usedCats = S.past.concat(S.cols).map((c) => c.cat).concat(S.final.cat);
  const used = usedKeys();
  S.past = S.past.concat(S.cols);
  S.cols = buildCols(chooseCats(usedCats, S.family), 2, S.family, used);
  S.stars = placeStars(2);
  S.round = 2;
  const low = Math.min(...S.players.map((p) => p.score));
  S.turn = S.players.findIndex((p) => p.score === low);
  startLesson();
}

let actx = null;
function tone(freqs, dur = 0.14, type = "triangle", gap = 0.11) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      const t = actx.currentTime + i * gap;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
    });
  } catch (e) {}
}

/* ===== Confetti ===== */
const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(n = 120) {
  if (reduceMotion) return;
  const cv = $("confetti"), ctx = cv.getContext("2d");
  const W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cols = ["#FFC83D", "#FF6B57", "#3CCB7F", "#4CB8FF", "#FF7FC8", "#FFFFFF"];
  const parts = Array.from({ length: n }, () => ({
    x: W / 2 + (Math.random() - 0.5) * W * 0.3, y: H * 0.45, vx: (Math.random() - 0.5) * 16, vy: -Math.random() * 16 - 6,
    s: 6 + Math.random() * 8, c: pick(cols), r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
  }));
  let frames = 0;
  (function step() {
    ctx.clearRect(0, 0, W, H);
    parts.forEach((p) => {
      p.vy += 0.45; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.vx *= 0.99;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
    });
    if (++frames < 150) requestAnimationFrame(step); else ctx.clearRect(0, 0, W, H);
  })();
}

/* ----- Lesson ----- */
function lessonCards() {
  const cards = [];
  S.cols.forEach((col, ci) => {
    const cat = catById(col.cat);
    cards.push({ type: "intro", ci, cat });
    col.clues.forEach((cl) => cards.push({ type: "fact", ci, cat, item: qk(cl.k) }));
  });
  if (S.round !== 2) cards.push({ type: "final", item: qk(S.final.k) });
  cards.push({ type: "ready" });
  return cards;
}
function startLesson(fromBoard) {
  S.lessonFromBoard = !!fromBoard;
  if (!fromBoard) S.lessonIdx = 0;
  show("lesson");
  $("lesson-title").textContent = S.round === 2 ? "Double Jeopardy Lesson" : "Lesson Time";
  $("lesson-skip").textContent = fromBoard ? "Back to the board ▶" : "I'm ready to play ▶";
  renderLesson();
}
function renderLesson() {
  const cards = lessonCards();
  const i = Math.max(0, Math.min(S.lessonIdx, cards.length - 1));
  S.lessonIdx = i;
  const c = cards[i];
  $("lesson-bar").style.width = Math.round((i / (cards.length - 1)) * 100) + "%";
  let html = "", say = "";
  if (c.type === "intro") {
    html = `<span class="cat-pill ${COLORS[c.ci]}">Topic ${c.ci + 1} of 5</span>
      <div class="pic" aria-hidden="true">${c.cat.emoji}</div>

      <div class="pic" aria-hidden="true">${c.item.e}</div>

    say = c.item.f;
  } else if (c.type === "final") {
    html = `<span class="cat-pill c1">⭐ Final Jeopardy sneak peek</span>
      <div class="pic" aria-hidden="true">${c.item.e}</div>
      <p class="fact">${c.item.f}</p>

    say = "Final Jeopardy sneak peek! " + c.item.f;
  } else {
    html = `<div class="pic" aria-hidden="true">🎉</div>
      <h3>You're ready!</h3>
      <p class="fact">You learned ${cards.filter((x) => x.type === "fact" || x.type === "final").length} facts. Now let's see how many you remember.</p>`;
    say = "You're ready! Now let's see how many you remember.";
  }
  $("lesson-card").innerHTML = html;
  $("lesson-card").dataset.say = say;
  $("lesson-back").disabled = i === 0;
  $("lesson-back").style.visibility = i === 0 ? "hidden" : "visible";
  const last = i === cards.length - 1;
  $("lesson-next").textContent = last ? (S.lessonFromBoard ? "Back to the board ▶" : "Let's play! ▶") : "Next ▶";
  $("lesson-next").classList.toggle("green", last);
  $("lesson-speak").hidden = !canSpeak;
  if (prefs.read) speak(say); else hush();
}

function botPickSquare() {
  const open = [];
  S.cols.forEach((col, ci) => col.clues.forEach((cl, ri) => { if (!cl.done) open.push({ ci, ri }); }));
  if (!open.length) return;
  // Hard Robo goes for the big points first; the others pick at random
  let choice = pick(open);
  if (prefs.botLevel === "hard") { const top = Math.max(...open.map((o) => o.ri)); choice = pick(open.filter((o) => o.ri === top)); }
  const tile = $("board").querySelector(`.tile[data-c="${choice.ci}"][data-r="${choice.ri}"]`);
  if (tile) tile.classList.add("bot-pick");

}
