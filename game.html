<title>Kids Jeopardy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Lexend:wght@400;500;700&display=swap">
<style>
/* Layout: one screen at a time (home → lesson → board → big finish). TV game-show look: blue cells on a black grid, gold values, white caps. */
:root {
  --night: #040A33;
  --night-dot: #0B1552;
  --blue: #0A1BA6;
  --blue-hi: #1B32D2;
  --blue-deep: #06106B;
  --line: #000000;
  --gold: #FFC72C;
  --white: #FFFFFF;
  --soft: #C3CCFF;
  --right: #1E9E5A;
  --wrong: #7A1F2B;
  --right-bg: #0E5A36;
  --wrong-bg: #551520;
  --font-display: "Oswald", "Arial Narrow", "Helvetica Neue", Impact, sans-serif;
  --font-body: "Lexend", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 10px;
  --stick: 0 6px 0 var(--line);
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background-color: var(--night);
  background-image: radial-gradient(var(--night-dot) 2px, transparent 2.5px);
  background-size: 28px 28px;
  color: var(--white);
  font-family: var(--font-body);
  font-size: 17px;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 4px solid var(--gold); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .02em; text-wrap: balance; margin: 0; line-height: 1.05; }

.wrap {
  min-height: 100%;
  box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 28px;
  max-width: 1180px;
  margin: 0 auto;
}

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5em;
  border: 3px solid var(--line); border-radius: var(--r);
  background: var(--gold); color: var(--line);
  font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; text-transform: uppercase; letter-spacing: .03em;
  padding: .4em 1.2em .38em; box-shadow: var(--stick);
  transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--line); }
.btn[disabled] { opacity: .5; cursor: default; }
.btn.big { font-size: 1.7rem; padding: .45em 1.5em .42em; }
.btn.ghost { background: transparent; color: var(--white); border-color: var(--soft); box-shadow: none; font-size: 1.05rem; }
.btn.ghost:active { transform: translateY(2px); }
.btn.alt { background: var(--blue-hi); color: var(--white); }
.btn.green { background: var(--right); color: var(--white); }
.btn.small { font-size: 1rem; padding: .32em .9em .3em; box-shadow: 0 4px 0 var(--line); }

/* ---------- HOME ---------- */
.logo { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 10px 0 22px; }
.logo-word {
  font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .02em;
  font-size: clamp(3.2rem, 11vw, 6rem); line-height: .95; color: var(--gold);
  text-shadow: 4px 4px 0 var(--line), 0 0 30px rgba(255, 199, 44, .25);
  display: flex; flex-wrap: wrap; justify-content: center; gap: 0 .3em;
}
.logo-tag { color: var(--soft); font-size: 1.05rem; text-align: center; margin: 0; }

.setup { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 18px; max-width: 1100px; margin: 0 auto; }
.panel { background: var(--blue-deep); color: var(--white); border: 3px solid var(--line); border-radius: var(--r); box-shadow: var(--stick); padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel h2 { font-size: 1.6rem; color: var(--gold); text-shadow: 2px 2px 0 var(--line); }
.panel .hint { color: var(--soft); font-size: .92rem; margin: -6px 0 0; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip {
  border: 3px solid var(--line); border-radius: 8px; background: var(--blue); color: var(--white);
  padding: 7px 14px 6px; font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; line-height: 1.15; text-transform: uppercase; letter-spacing: .02em;
  display: flex; flex-direction: column; align-items: flex-start; text-align: left;
}
.chip small { font-family: var(--font-body); font-weight: 400; font-size: .76rem; color: var(--soft); text-transform: none; letter-spacing: 0; }
.chip[aria-pressed="true"] { background: var(--gold); color: var(--line); box-shadow: 0 4px 0 var(--line); }
.chip[aria-pressed="true"] small { color: var(--line); }
.chip.round { min-width: 52px; align-items: center; }
.names { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); gap: 10px; }
.pl { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.roles { display: flex; gap: 6px; }
.chip.mini { flex: 1; align-items: center; font-size: .95rem; padding: 5px 8px 4px; }
.sub-h { margin: 4px 0 -4px; font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; font-size: 1.1rem; color: var(--gold); }
.chip.static { flex: none; cursor: default; background: var(--blue-deep); }
.names input {
  width: 100%; box-sizing: border-box; font: inherit; font-size: 1.1rem; color: var(--line);
  border: 3px solid var(--line); border-radius: 8px; padding: 8px 12px; background: var(--white);
}
.toggle { display: flex; align-items: center; gap: 12px; background: var(--blue); border: 3px solid var(--line); border-radius: 8px; padding: 10px 14px; text-align: left; color: var(--white); }
.toggle .knob { flex: none; width: 52px; height: 30px; border-radius: 999px; border: 3px solid var(--line); background: var(--blue-deep); position: relative; transition: background .15s; }
.toggle .knob::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--white); border: 2px solid var(--line); transition: left .15s; }
.toggle[aria-pressed="true"] .knob { background: var(--gold); }
.toggle[aria-pressed="true"] .knob::after { left: 24px; }
.toggle b { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; text-transform: uppercase; letter-spacing: .02em; display: block; }
.toggle span.t { font-size: .85rem; color: var(--soft); }
.start-row { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 26px; }

/* ---------- LESSON ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.topbar h2 { font-size: clamp(1.4rem, 3.5vw, 2rem); color: var(--gold); text-shadow: 2px 2px 0 var(--line); }
.progress { flex: 1 1 200px; height: 16px; border-radius: 999px; background: var(--blue-deep); border: 3px solid var(--line); overflow: hidden; min-width: 120px; }
.progress i { display: block; height: 100%; background: var(--gold); width: 0; transition: width .3s; }
.lesson-card {
  background: var(--blue); color: var(--white); border: 4px solid var(--line); border-radius: 14px; box-shadow: 0 8px 0 var(--line);
  max-width: 820px; margin: 0 auto; padding: clamp(18px, 4vw, 36px); display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;
  min-height: min(56vh, 460px); justify-content: center; box-sizing: border-box;
}
.cat-pill { font-family: var(--font-display); font-weight: 600; font-size: 1rem; letter-spacing: .06em; text-transform: uppercase; border: 3px solid var(--line); border-radius: 6px; padding: 3px 12px 2px; background: var(--gold); color: var(--line); }
.lesson-card .pic { font-size: clamp(4rem, 14vw, 7rem); line-height: 1; }
.lesson-card .fact { font-size: clamp(1.3rem, 3.4vw, 2rem); line-height: 1.4; max-width: 30ch; margin: 0; text-shadow: 2px 2px 0 var(--line); }
.lesson-card .fact b { background: var(--gold); color: var(--line); text-shadow: none; padding: 0 .2em; border-radius: 4px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.lesson-card .peek { font-size: .98rem; color: var(--soft); max-width: 46ch; margin: 0; }
.lesson-card .peek strong { color: var(--white); }
.lesson-card h3 { font-size: clamp(2.2rem, 6vw, 3.4rem); color: var(--gold); text-shadow: 3px 3px 0 var(--line); }
.lesson-nav { display: flex; justify-content: center; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 22px; }

/* ---------- BOARD ---------- */
.scores { display: flex; flex-wrap: wrap; gap: 10px; flex: 1 1 auto; }
.score {
  display: flex; align-items: center; gap: 10px; background: var(--blue-deep); border: 3px solid var(--line); border-radius: 8px; padding: 5px 14px 4px;
  font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; text-transform: uppercase; color: var(--soft);
}
.score .pts { font-size: 1.5rem; color: var(--white); font-variant-numeric: tabular-nums; }
.score.turn { background: var(--gold); color: var(--line); box-shadow: 0 4px 0 var(--line); }
.score.turn .pts { color: var(--line); }
.turn-line { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; font-size: clamp(1.2rem, 3vw, 1.6rem); text-align: center; margin: 4px 0 12px; }
.board {
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: clamp(4px, .8vw, 8px);
  background: var(--line); border: clamp(4px, .8vw, 8px) solid var(--line); border-radius: 6px; box-shadow: 0 0 0 2px var(--blue-deep), 0 10px 30px rgba(0, 0, 0, .5);
}
.board.locked { pointer-events: none; }
.col { display: grid; grid-template-rows: auto repeat(5, 1fr); gap: clamp(4px, .8vw, 8px); min-width: 0; }
.cat-head {
  background: var(--blue); color: var(--white); border-radius: 2px; margin-bottom: clamp(4px, .8vw, 8px);
  min-height: clamp(70px, 13vh, 112px); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 4px; text-align: center;
}
.cat-head .e { font-size: clamp(1.3rem, 3.2vw, 2rem); line-height: 1; }
.cat-head .n { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .02em; font-size: clamp(.8rem, 2vw, 1.3rem); line-height: 1.05; overflow-wrap: anywhere; margin-top: 4px; text-shadow: 2px 2px 0 var(--line); }
.tile {
  border: 0; border-radius: 2px; background: var(--blue); color: var(--gold);
  height: clamp(56px, 11vh, 104px); font-family: var(--font-display); font-weight: 700; font-size: clamp(1.4rem, 4.6vw, 3rem);
  text-shadow: 3px 3px 0 var(--line); font-variant-numeric: tabular-nums; padding: 0; transition: background .1s;
}
.tile:active { background: var(--blue-hi); }
.tile.bot-pick { background: var(--blue-hi); outline: 4px solid var(--gold); outline-offset: -4px; }
.tile.done { background: var(--blue-deep); color: var(--soft); text-shadow: none; font-size: clamp(1rem, 2.6vw, 1.5rem); cursor: default; }
.board-foot { display: flex; justify-content: center; margin-top: 22px; }
.round-tag { margin: 0 auto 6px; width: fit-content; font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: 1rem; color: var(--soft); border: 2px solid var(--soft); border-radius: 6px; padding: 2px 12px 1px; }
.round-tag.double { color: var(--line); background: var(--gold); border-color: var(--line); box-shadow: 0 3px 0 var(--line); font-size: 1.15rem; }

/* Round break choices */
.next-choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 14px; width: 100%; }
.next-choice {
  display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center; min-width: 0;
  border: 3px solid var(--line); border-radius: var(--r); box-shadow: var(--stick); padding: 16px 16px 14px;
  background: var(--gold); color: var(--line); transition: transform .08s, box-shadow .08s;
}
.next-choice b { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .03em; font-size: 1.6rem; }
.next-choice span { font-size: .98rem; line-height: 1.35; }
.next-choice.alt { background: var(--blue-hi); color: var(--white); }
.next-choice:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--line); }

/* ---------- CLUE MODAL ---------- */
.modal { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .8); display: flex; align-items: center; justify-content: center; overflow-y: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.clue {
  background: var(--blue); color: var(--white); border: 4px solid var(--line); border-radius: 14px; box-shadow: 0 8px 0 var(--line);
  width: 100%; max-width: 820px; padding: clamp(16px, 3.5vw, 32px); box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; margin: auto;
  animation: pop .25s ease-out;
}
@keyframes pop { from { transform: scale(.85); opacity: .4; } to { transform: scale(1); opacity: 1; } }
.clue-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.clue-top .val { font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; color: var(--gold); text-shadow: 2px 2px 0 var(--line); }
.star-banner { background: var(--gold); color: var(--line); border: 3px solid var(--line); border-radius: 8px; text-align: center; font-family: var(--font-display); font-weight: 700; text-transform: uppercase; font-size: clamp(1.3rem, 3.5vw, 1.8rem); padding: 4px 10px 2px; }
.who { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; font-size: 1.2rem; color: var(--soft); text-align: center; }
.q { font-size: clamp(1.45rem, 4vw, 2.35rem); line-height: 1.3; text-align: center; margin: 0; font-weight: 500; text-shadow: 2px 2px 0 var(--line); }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; width: 100%; }
@media (max-width: 560px) { .choices { grid-template-columns: 1fr; } }
.choices.locked { pointer-events: none; }
.choice {
  border: 3px solid var(--line); border-radius: 10px; background: var(--blue-deep); box-shadow: 0 5px 0 var(--line); color: var(--white);
  font-size: clamp(1.1rem, 2.8vw, 1.45rem); font-weight: 500; padding: 14px 14px 12px; text-align: left; display: flex; gap: 12px; align-items: center; min-height: 64px;
}
.choice .k { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--line); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; background: var(--gold); color: var(--line); font-size: 1.1rem; }
.choice:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
.choice.right { background: var(--right); }
.choice.wrong { background: var(--wrong); text-decoration: line-through; text-decoration-thickness: 2px; }
.choice.bot-pick { outline: 4px solid var(--gold); outline-offset: 2px; }
.choice[disabled] { cursor: default; }
.choice.dim { opacity: .45; }
.result { border: 3px solid var(--line); border-radius: 10px; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; text-align: center; }
.result.ok { background: var(--right-bg); }
.result.no { background: var(--wrong-bg); }
.result.pass { background: rgba(255,255,255,.1); }
.who small { display: block; font-size: .85rem; color: var(--gold); text-transform: none; letter-spacing: 0; margin-top: 2px; }
.result h3 { font-size: clamp(1.6rem, 4.5vw, 2.4rem); color: var(--gold); text-shadow: 2px 2px 0 var(--line); }
.result p { margin: 0; font-size: 1.1rem; line-height: 1.45; }
.result p b { background: var(--gold); color: var(--line); padding: 0 .2em; border-radius: 4px; }
.thinking { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; font-size: 1.4rem; text-align: center; color: var(--gold); }
.thinking i { display: inline-block; animation: blink 1.2s infinite; font-style: normal; }
.thinking i:nth-child(2) { animation-delay: .2s; } .thinking i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
.clue-actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
/* Grown-up questions in the Family game: say it out loud, reveal, then judge */
.grown-tag { align-self: center; font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; font-size: .95rem; color: var(--soft); border: 2px solid var(--soft); border-radius: 6px; padding: 2px 10px 1px; }
.say-hint { text-align: center; color: var(--soft); font-size: 1.05rem; margin: 0; }
.answer-box { border: 3px solid var(--line); border-radius: 10px; background: var(--blue-deep); padding: 12px 16px; text-align: center; display: flex; flex-direction: column; gap: 4px; }
.answer-box small { color: var(--soft); font-family: var(--font-display); text-transform: uppercase; letter-spacing: .05em; font-size: .95rem; }
.answer-box b { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; font-size: clamp(1.6rem, 4.5vw, 2.4rem); color: var(--gold); text-shadow: 2px 2px 0 var(--line); overflow-wrap: anywhere; }
.btn.red { background: var(--wrong); color: var(--white); }
/* Kid trying the grown-up question for triple points */
.btn.boost { background: #FF7A1A; color: var(--line); }
.star-banner.boost { background: #FF7A1A; }

/* ---------- FINAL & END ---------- */
.center-card { background: var(--blue); color: var(--white); border: 4px solid var(--line); border-radius: 14px; box-shadow: 0 8px 0 var(--line);
  max-width: 760px; margin: 30px auto 0; padding: clamp(18px, 4vw, 36px); display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; box-sizing: border-box; }
.center-card h2 { font-size: clamp(2.2rem, 6vw, 3.4rem); color: var(--gold); text-shadow: 3px 3px 0 var(--line); }
.center-card p { margin: 0; font-size: 1.2rem; line-height: 1.45; max-width: 36ch; }
.center-card .note { font-size: 1rem; color: var(--soft); }
.wagers { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
#clue .note { font-size: 1rem; color: var(--soft); margin: 4px 0 12px; text-align: center; }
#clue .wagers { margin: 8px 0; }
.podium { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 460px; }
.podium .row { display: flex; align-items: center; gap: 12px; border: 3px solid var(--line); border-radius: 8px; padding: 8px 14px 6px; background: var(--blue-deep); font-family: var(--font-display); font-weight: 600; text-transform: uppercase; font-size: 1.4rem; }
.podium .row.win { background: var(--gold); color: var(--line); box-shadow: 0 4px 0 var(--line); }
.podium .row .nm { flex: 1; text-align: left; min-width: 0; overflow-wrap: anywhere; }
.podium .row .nm small { display: block; font-family: var(--font-body); font-weight: 400; text-transform: none; font-size: .85rem; opacity: .8; }
.podium .row .pts { font-variant-numeric: tabular-nums; }
.trophy { font-size: clamp(4rem, 14vw, 6.5rem); line-height: 1; }

#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 40; width: 100%; height: 100%; }
@media (prefers-reduced-motion: reduce) { .clue { animation: none; } .progress i { transition: none; } .thinking i { animation: none; opacity: 1; } }
</style>

<canvas id="confetti" aria-hidden="true"></canvas>

<main class="wrap" id="app">
  <!-- HOME -->
  <section id="scr-home">
    <div class="logo">
      <div class="logo-word" aria-label="Kids Jeopardy"><span>Kids</span><span>Jeopardy</span></div>
      <p class="logo-tag">Learn the facts, then play the board!</p>
    </div>
    <div class="setup">
      <div class="panel">
        <h2>Who's playing?</h2>
        <div class="chips" id="player-count" role="group" aria-label="Number of players"></div>

          <span class="knob" aria-hidden="true"></span>
          <span><b>👪 Family game</b><span class="t">Kids and grown-ups share one board. Grown-ups get grown-up questions!</span></span>
        </button>
        <div class="names" id="names"></div>
        <button class="toggle" id="bot-toggle" type="button" aria-pressed="false">
          <span class="knob" aria-hidden="true"></span>
          <span><b>🤖 Play against the computer</b><span class="t">Robo the robot joins the game</span></span>
        </button>
        <div class="chips" id="bot-levels" role="group" aria-label="Computer level"></div>
      </div>
      <div class="panel">
        <h2>How tricky?</h2>
        <p class="hint" id="level-hint">Easy questions are worth 100. The hardest are worth 500.</p>
        <div class="chips" id="levels" role="group" aria-label="Grade level"></div>
        <button class="toggle" id="read-toggle" type="button" aria-pressed="true">
          <span class="knob" aria-hidden="true"></span>
          <span><b>Read questions out loud</b><span class="t">Great for new readers</span></span>
        </button>
        <p class="sub-h">Wrong answers on the board</p>
        <div class="chips" id="penalty" role="group" aria-label="Wrong answers on the board"></div>
        <p class="sub-h">How kids answer</p>
        <div class="chips" id="answers" role="group" aria-label="How kids answer"></div>
      </div>
      <div class="panel">
        <h2>Topics</h2>
        <p class="hint" id="topics-hint">Favorites are books, sports, movies, and TV.</p>

    <div class="start-row">
      <button class="btn big" id="go-lesson" type="button">📚 Start the Lesson</button>

  [3,"🌅","In which direction does the Sun rise in the morning?","The east",["The west","The north","The south"],"The Sun rises in <b>the east</b> and sets in the west."],
  [4,"🏜️","What is it called when wind and water slowly wear away rock and soil?","Erosion",["Evaporation","Pollution","Eruption"],"Slowly wearing away rock and soil is called <b>erosion</b>. Erosion carved the Grand Canyon!"],
  [4,"🌀","What is a giant spinning storm that forms over warm ocean water?","A hurricane",["A tornado","A blizzard","A drought"],"A <b>hurricane</b> is a huge spinning storm that starts over warm ocean water."],
  [5,"🌫️","When water vapor cools and turns back into tiny drops, like on a cold glass, what is it called?","Condensation",["Evaporation","Precipitation","Melting"],"Water vapor turning back into drops is <b>condensation</b>. That's how clouds form!"],
  [5,"🌍","What is the very center of the Earth called?","The core",["The crust","The mantle","The atmosphere"],"The center of the Earth is the <b>core</b>. It's made of super hot metal."],
  [5,"🧩","What are the giant moving pieces of Earth's crust called?","Tectonic plates",["Fault lines","Glaciers","Continents"],"Earth's crust is broken into <b>tectonic plates</b>. When they move, we get earthquakes and volcanoes."],
 ]},
 { id: "plants", name: "Plants & Bugs", emoji: "🌻", intro: "Let's dig into the garden!", qs: [
  [1, "🌱", "What do plants need to grow?", "Sunlight and water", ["Candy and juice", "Only darkness", "Loud music"], "Plants need <b>sunlight and water</b> to grow big and strong."],
  [1, "🦋", "What does a caterpillar turn into?", "A butterfly", ["A spider", "A bee", "A ladybug"], "A caterpillar turns into a <b>butterfly</b>!"],
  [2, "🥕", "What part of a plant grows underground and soaks up water?", "The roots", ["The petals", "The leaves", "The flowers"], "The <b>roots</b> grow underground and drink up water for the plant."],
  [2, "🐝", "What sweet food do bees make?", "Honey", ["Jam", "Syrup", "Sugar cubes"], "Bees make <b>honey</b> from the nectar in flowers."],
  [3, "🐜", "How many legs does an insect have?", "6", ["8", "4", "10"], "Every insect has <b>6 legs</b>. Ants, bees, and beetles are insects."],
  [3, "🍃", "Which part of a plant makes food using sunlight?", "The leaves", ["The roots", "The stem", "The seeds"], "The <b>leaves</b> use sunlight to make food for the plant."],
  [4, "☀️", "What is the process plants use to make food from sunlight?", "Photosynthesis", ["Hibernation", "Metamorphosis", "Migration"], "Plants make food from sunlight, water, and air. This is called <b>photosynthesis</b>."],
  [4, "🐞", "What are the three main body parts of an insect?", "Head, thorax, abdomen", ["Head, wings, tail", "Arms, legs, feet", "Shell, horns, tail"], "An insect's three body parts are the <b>head, thorax, and abdomen</b>."],
  [5, "🐛", "What do we call the big change from caterpillar to butterfly?", "Metamorphosis", ["Photosynthesis", "Pollination", "Evaporation"], "The change from caterpillar to butterfly is called <b>metamorphosis</b>."],
  [5, "🌸", "When bees carry pollen from flower to flower, what is it called?", "Pollination", ["Germination", "Hibernation", "Migration"], "Carrying pollen from flower to flower is called <b>pollination</b>. It helps plants make seeds."],
  [1,"🍎","Which of these grows on a tree?","An apple",["A carrot","A potato","A peanut"],"<b>Apples</b> grow on trees. Carrots and potatoes grow under the ground."],
  [2,"✨","Which bug lights up at night?","A firefly",["A ladybug","An ant","A grasshopper"],"A <b>firefly</b> makes its own light to flash signals to other fireflies."],
  [2,"🐞","What does a ladybug usually look like?","Red with black spots",["Green with stripes","Blue with dots","All yellow"],"Most ladybugs are <b>red with black spots</b>. They eat bugs that hurt plants."],
  [3,"🌸","What sweet juice do bees drink from flowers to make honey?","Nectar",["Sap","Rain","Milk"],"Bees drink <b>nectar</b> from flowers and turn it into honey."],
  [3,"🕷️","Is a spider an insect?","No, it has 8 legs",["Yes","Only big spiders","Only baby spiders"],"<b>No!</b> Spiders have 8 legs and 2 body parts, so they are arachnids, not insects."],
  [4,"🌲","What do we call trees that stay green all year, like pine trees?","Evergreens",["Palm trees","Saplings","Fruit trees"],"Trees that stay green all year are <b>evergreens</b>. Pine and spruce trees are evergreens."],
  [4,"🐛","What does a caterpillar make around itself before it turns into a butterfly?","A chrysalis",["A nest","A web","A shell"],"A caterpillar forms a <b>chrysalis</b>. Inside, it changes into a butterfly!"],
  [5,"🍂","What do we call trees that lose their leaves every fall?","Deciduous",["Evergreen","Tropical","Hollow"],"Trees that drop their leaves in fall are <b>deciduous</b>, like maples and oaks."],
  [5,"🌿","What gas do plants take in from the air to make their food?","Carbon dioxide",["Oxygen","Helium","Smoke"],"Plants take in <b>carbon dioxide</b> and give off the oxygen we breathe!"],
  [5,"🐜","In an ant colony, what is the ant that lays all the eggs called?","The queen",["The king","The worker","The soldier"],"The <b>queen</b> lays all the eggs. Some queens lay thousands every day!"],
 ]},
 { id: "maps", name: "Maps & Places", emoji: "🗺️", intro: "Grab your map! Let's travel the world.", qs: [
  [1, "🏞️", "What is the name of our country?", "The United States of America", ["Canada", "Mexico", "France"], "We live in <b>the United States of America</b>, also called the USA."],
  [1, "🌊", "On a map, what color usually shows water?", "Blue", ["Red", "Yellow", "Brown"], "On most maps, water like oceans and lakes is colored <b>blue</b>."],
  [2, "🧭", "What are the four main directions on a compass?", "North, South, East, West", ["Up, Down, Left, Right", "Front, Back, Top, Bottom", "Hot, Cold, Wet, Dry"], "The four directions are <b>North, South, East, and West</b>. A silly way to remember: Never Eat Soggy Waffles!"],
  [2, "🐳", "What is the biggest ocean on Earth?", "The Pacific Ocean", ["The Atlantic Ocean", "The Indian Ocean", "The Arctic Ocean"], "The <b>Pacific Ocean</b> is the biggest and deepest ocean."],
  [3, "🌎", "How many continents are there?", "7", ["5", "6", "9"], "There are <b>7 continents</b>. We live on North America."],
  [3, "🏛️", "What is the capital of the United States?", "Washington, D.C.", ["New York City", "Los Angeles", "Chicago"], "The capital of the United States is <b>Washington, D.C.</b> The President lives there in the White House."],
  [4, "🐫", "On which continent is Egypt, home of the great pyramids?", "Africa", ["Asia", "Europe", "South America"], "Egypt and its pyramids are in <b>Africa</b>."],
  [4, "❄️", "What is the largest country in the world?", "Russia", ["China", "Canada", "The United States"], "<b>Russia</b> is the biggest country in the world. It stretches across Europe and Asia."],
  [5, "🏜️", "Which river is usually called the longest river in the world?", "The Nile", ["The Mississippi", "The Thames", "The Rhine"], "<b>The Nile</b> in Africa is usually called the longest river in the world."],
  [5, "🌐", "What imaginary line goes around the middle of the Earth?", "The equator", ["The prime meridian", "The North Pole", "The Great Wall"], "The <b>equator</b> is an imaginary line around the middle of the Earth. Places near it are hot!"],
  [1,"🌎","What is the name of the planet we live on?","Earth",["Mars","The Moon","Jupiter"],"We live on planet <b>Earth</b>!"],
  [2,"🌐","What do we call a round model of the Earth?","A globe",["An atlas","A compass","A ruler"],"A <b>globe</b> is a round model of the Earth. It shows the land and oceans."],
  [2,"🍁","Which country is just north of the United States?","Canada",["Mexico","Brazil","England"],"<b>Canada</b> is north of the United States. Mexico is to the south."],
  [3,"🏔️","What is the tallest mountain in the world?","Mount Everest",["Mount Rushmore","Mount Fuji","Pikes Peak"],"<b>Mount Everest</b> is the tallest mountain. It's more than 5 miles high!"],
  [3,"🐨","On which continent do kangaroos and koalas live in the wild?","Australia",["Africa","South America","Asia"],"Kangaroos and koalas live in <b>Australia</b>. It's a country and a continent!"],
  [4,"🐧","Which continent is the coldest and is covered in ice?","Antarctica",["Europe","Asia","North America"],"<b>Antarctica</b> is the coldest continent. Penguins live there, but no one lives there all year."],
  [4,"🌊","Which ocean is along the east coast of the United States?","The Atlantic Ocean",["The Pacific Ocean","The Indian Ocean","The Arctic Ocean"],"<b>The Atlantic Ocean</b> is on the east coast. The Pacific is on the west coast."],
  [5,"🐫","What is the largest hot desert in the world?","The Sahara",["The Gobi","Death Valley","The Mojave"],"<b>The Sahara</b> in Africa is the largest hot desert. It's almost as big as the whole United States!"],
  [5,"🏙️","What is the capital of Canada?","Ottawa",["Toronto","Vancouver","Montreal"],"The capital of Canada is <b>Ottawa</b>. Toronto is its biggest city."],
  [5,"🧭","What are the lines on a map that run from the North Pole to the South Pole?","Lines of longitude",["Lines of latitude","The equator","Borders"],"Lines from pole to pole are <b>lines of longitude</b>. Lines of latitude go side to side, like the equator."],
 ]},
 { id: "history", name: "America's Story", emoji: "🗽", intro: "Let's travel back in time!", qs: [
  [1, "🗽", "What is the big green statue in New York that holds up a torch?", "The Statue of Liberty", ["Mount Rushmore", "The Lincoln Memorial", "The Golden Gate"], "The <b>Statue of Liberty</b> holds a torch in New York. It was a gift from France."],
  [1, "🏳️", "What colors are on the American flag?", "Red, white, and blue", ["Green and yellow", "Orange and black", "Purple and pink"], "The American flag is <b>red, white, and blue</b>."],
  [2, "🎩", "Who was the first President of the United States?", "George Washington", ["Abraham Lincoln", "Thomas Jefferson", "Ben Franklin"], "<b>George Washington</b> was the very first President."],
  [2, "🎆", "Which holiday is America's birthday?", "The Fourth of July", ["Thanksgiving", "Halloween", "Labor Day"], "<b>The Fourth of July</b> is America's birthday. We celebrate with fireworks!"],
  [3, "⭐", "How many stars are on the American flag?", "50", ["13", "48", "100"], "The flag has <b>50 stars</b>, one for each state. The 13 stripes stand for the first 13 colonies."],
  [3, "🪙", "Which President is on the penny?", "Abraham Lincoln", ["George Washington", "Thomas Jefferson", "John Adams"], "<b>Abraham Lincoln</b> is on the penny."],
  [4, "📜", "What paper, signed in 1776, said America was free from Britain?", "The Declaration of Independence", ["The Constitution", "The Bill of Rights", "A treasure map"], "In 1776, leaders signed the <b>Declaration of Independence</b>."],
  [4, "✈️", "Who flew the first successful airplane in 1903?", "The Wright brothers", ["Lewis and Clark", "Thomas Edison", "Henry Ford"], "<b>The Wright brothers</b>, Orville and Wilbur, flew the first airplane in 1903."],
  [5, "⚖️", "What are the first ten amendments to the Constitution called?", "The Bill of Rights", ["The Ten Commandments", "The Declaration", "The Pledge"], "The first ten amendments are called the <b>Bill of Rights</b>. They protect freedoms like free speech."],
  [5, "🎤", "Who gave the famous “I Have a Dream” speech?", "Martin Luther King Jr.", ["Abraham Lincoln", "Benjamin Franklin", "George Washington"], "<b>Martin Luther King Jr.</b> gave the “I Have a Dream” speech in 1963 about fairness for all people."],
  [1,"🦃","Which November holiday is about giving thanks and eating turkey?","Thanksgiving",["Halloween","Valentine's Day","Easter"],"<b>Thanksgiving</b> is in November. Families share a big meal and say what they're thankful for."],
  [2,"🏛️","Where does the President of the United States live?","The White House",["The Capitol","Mount Rushmore","The Pentagon"],"The President lives and works in <b>the White House</b> in Washington, D.C."],
  [2,"💵","Whose face is on the one-dollar bill?","George Washington",["Abraham Lincoln","Benjamin Franklin","Thomas Jefferson"],"<b>George Washington</b>, the first President, is on the one-dollar bill."],
  [3,"🗿","Which mountain has the faces of four presidents carved into it?","Mount Rushmore",["Mount Everest","Pikes Peak","Mount Hood"],"<b>Mount Rushmore</b> in South Dakota shows Washington, Jefferson, Theodore Roosevelt, and Lincoln."],
  [3,"⛵","What was the name of the ship that brought the Pilgrims to America in 1620?","The Mayflower",["The Titanic","The Santa María","The Black Pearl"],"The Pilgrims sailed on <b>the Mayflower</b> in 1620."],
  [4,"✒️","Who wrote most of the Declaration of Independence?","Thomas Jefferson",["George Washington","Benjamin Franklin","Abraham Lincoln"],"<b>Thomas Jefferson</b> wrote most of the Declaration of Independence. He later became the third President."],
  [4,"🐴","Who rode a horse at night in 1775 to warn that British soldiers were coming?","Paul Revere",["Benjamin Franklin","George Washington","John Adams"],"<b>Paul Revere</b> made his famous midnight ride to warn the colonists."],
  [5,"🚂","Which brave woman led many enslaved people to freedom on the Underground Railroad?","Harriet Tubman",["Rosa Parks","Susan B. Anthony","Clara Barton"],"<b>Harriet Tubman</b> escaped slavery, then went back again and again to lead others to freedom."],
  [5,"🚌","In 1955, who refused to give up her seat on a bus in Montgomery, Alabama?","Rosa Parks",["Harriet Tubman","Ruby Bridges","Eleanor Roosevelt"],"<b>Rosa Parks</b> refused to give up her bus seat, which helped start the fight to end unfair laws."],
  [5,"⚖️","What are the three branches of the U.S. government?","Legislative, executive, judicial",["Army, Navy, Air Force","Federal, state, city","North, South, West"],"The three branches are <b>legislative, executive, and judicial</b>: Congress makes laws, the President carries them out, and the courts judge them."],
 ]},
 { id: "stories", name: "Storybook", emoji: "📖", intro: "Once upon a time... let's remember some stories!", qs: [
  [1, "🐻", "In “Goldilocks and the Three Bears,” how many bears are there?", "3", ["2", "4", "7"], "There are <b>3 bears</b>: Papa Bear, Mama Bear, and Baby Bear."],
  [1, "🌱", "What did Jack trade for the magic beans?", "A cow", ["A pig", "A horse", "A goat"], "In “Jack and the Beanstalk,” Jack traded his <b>cow</b> for magic beans."],
  [2, "🐷", "In “The Three Little Pigs,” what was the strongest house made of?", "Bricks", ["Straw", "Sticks", "Mud"], "The house made of <b>bricks</b> was so strong the wolf couldn't blow it down."],
  [2, "👠", "Who wore a glass slipper to the royal ball?", "Cinderella", ["Snow White", "Rapunzel", "Little Red Riding Hood"], "<b>Cinderella</b> lost her glass slipper at the ball."],
  [3, "🐢", "In “The Tortoise and the Hare,” who won the race?", "The tortoise", ["The hare", "The fox", "It was a tie"], "<b>The tortoise</b> won! Slow and steady wins the race."],
  [3, "🍞", "Who dropped a trail of breadcrumbs in the forest?", "Hansel and Gretel", ["Jack and Jill", "Peter Pan", "The Gingerbread Man"], "<b>Hansel and Gretel</b> dropped breadcrumbs to find their way home."],
  [4, "🦊", "What do we call a short story that teaches a lesson, often with talking animals?", "A fable", ["A biography", "A poem", "A dictionary"], "A short story with a lesson, often with talking animals, is a <b>fable</b>."],
  [4, "🐇", "Which girl falls down a rabbit hole into Wonderland?", "Alice", ["Dorothy", "Wendy", "Goldilocks"], "<b>Alice</b> follows a white rabbit down a hole into Wonderland."],
  [5, "🌾", "In “The Wizard of Oz,” what did the Scarecrow want?", "A brain", ["A heart", "Courage", "A new hat"], "The Scarecrow wanted <b>a brain</b>. The Tin Man wanted a heart, and the Lion wanted courage."],
  [5, "🕸️", "In “Charlotte's Web,” what kind of animal is Charlotte?", "A spider", ["A pig", "A goose", "A rat"], "Charlotte is a <b>spider</b> who writes words in her web to save her friend Wilbur the pig."],
  [1,"🐺","In “Little Red Riding Hood,” who was waiting in Grandma's bed?","The wolf",["A bear","A fox","A dragon"],"<b>The wolf</b> was in Grandma's bed. “What big teeth you have!”"],
  [2,"🍎","In “Snow White,” how many dwarfs are there?","7",["5","3","12"],"Snow White lives with <b>7 dwarfs</b>."],
  [2,"🐛","In “The Very Hungry Caterpillar,” what does the caterpillar become at the end?","A butterfly",["A moth","A bee","A dragonfly"],"The very hungry caterpillar becomes a beautiful <b>butterfly</b>."],
  [3,"🎩","Who wrote “The Cat in the Hat” and “Green Eggs and Ham”?","Dr. Seuss",["Eric Carle","Mo Willems","Roald Dahl"],"<b>Dr. Seuss</b> wrote both books, plus “The Grinch” and lots more!"],
  [3,"🤥","What happens to Pinocchio when he tells a lie?","His nose grows",["His ears grow","He turns blue","He starts to sneeze"],"When Pinocchio lies, <b>his nose grows</b> longer!"],
  [4,"🧚","Which boy never grows up and lives in Neverland?","Peter Pan",["Pinocchio","Robin Hood","Oliver Twist"],"<b>Peter Pan</b> lives in Neverland with Tinker Bell and the Lost Boys."],
  [4,"🍫","In “Charlie and the Chocolate Factory,” who owns the chocolate factory?","Willy Wonka",["Charlie Bucket","Augustus Gloop","Grandpa Joe"],"<b>Willy Wonka</b> owns the factory. Charlie finds a golden ticket to visit it."],
  [5,"🦁","In “The Lion, the Witch and the Wardrobe,” what magical land do the children find?","Narnia",["Neverland","Oz","Wonderland"],"The children step through a wardrobe into <b>Narnia</b>, where Aslan the lion rules."],
  [5,"🕸️","Who wrote “Charlotte's Web”?","E. B. White",["Roald Dahl","Dr. Seuss","Beverly Cleary"],"<b>E. B. White</b> wrote “Charlotte's Web.” He also wrote “Stuart Little.”"],
  [5,"🦸","What do we call the main character in a story?","The protagonist",["The villain","The narrator","The author"],"The main character is the <b>protagonist</b>. The bad guy is often called the antagonist."],
 ]},
 { id: "ocean", name: "Ocean Life", emoji: "🐙", intro: "Let's dive deep into the ocean!", qs: [
  [1, "🐙", "Which sea animal has eight arms?", "An octopus", ["A starfish", "A jellyfish", "A seal"], "An <b>octopus</b> has eight arms. “Octo” means eight!"],
  [1, "🦀", "Which ocean animal has a hard shell and walks sideways?", "A crab", ["A fish", "A whale", "A seal"], "A <b>crab</b> has a hard shell and scuttles sideways."],
  [2, "🐟", "What do fish use to breathe underwater?", "Gills", ["Lungs", "Noses", "Fins"], "Fish breathe with <b>gills</b>, which take oxygen out of the water."],
  [2, "⭐", "How many arms do most sea stars (starfish) have?", "5", ["3", "8", "10"], "Most sea stars have <b>5 arms</b>. If one breaks off, it can grow back!"],
  [3, "🐳", "Are whales fish or mammals?", "Mammals", ["Fish", "Reptiles", "Amphibians"], "Whales are <b>mammals</b>, like us. They come up to the surface to breathe air."],
  [3, "🐬", "Which smart ocean animal talks with clicks and whistles?", "A dolphin", ["A shark", "A jellyfish", "A clam"], "A <b>dolphin</b> talks with clicks and whistles. Dolphins are very smart!"],
  [4, "🦈", "What is the largest fish in the ocean?", "The whale shark", ["The great white shark", "The tuna", "The swordfish"], "The <b>whale shark</b> is the biggest fish. It's gentle and eats tiny plankton."],
  [4, "🐠", "What are coral reefs made of?", "Tiny animals called coral", ["Rocks from volcanoes", "Seaweed", "Old shipwrecks"], "Coral reefs are built by <b>tiny animals called coral</b>."],
  [5, "🔬", "What are the tiny drifting plants and animals that many sea creatures eat?", "Plankton", ["Barnacles", "Sponges", "Pebbles"], "<b>Plankton</b> are tiny living things that drift in the sea. Even huge whales eat them!"],
  [5, "🌊", "About how much of Earth's surface is covered by oceans?", "About 70%", ["About 10%", "About 30%", "About 95%"], "Oceans cover <b>about 70%</b> of Earth's surface. That's why Earth looks blue from space."],
  [1,"🦈","Which ocean animal has lots of sharp teeth and a fin on its back?","A shark",["A jellyfish","A seahorse","A clam"],"A <b>shark</b> has rows of sharp teeth. When one falls out, a new one moves in!"],
  [2,"🐢","Which sea animal has a shell and crawls onto the beach to lay its eggs?","A sea turtle",["A crab","A dolphin","A seal"],"A <b>sea turtle</b> lays its eggs in the sand. The babies crawl to the ocean when they hatch."],
  [2,"🧂","What does ocean water taste like?","Salty",["Sweet","Sour","Like nothing"],"Ocean water is <b>salty</b>, so people can't drink it."],
  [3,"🐡","Which fish can puff up like a spiky ball when it's scared?","A pufferfish",["A clownfish","A goldfish","A tuna"],"A <b>pufferfish</b> gulps water to puff up big so other fish can't eat it."],
  [3,"🐋","How do whales breathe?","Through a blowhole on top of their head",["With gills","Through their tail","They don't need air"],"Whales breathe air <b>through a blowhole on top of their head</b>. That's the spout you see!"],
  [4,"🦑","What does an octopus or squid squirt to escape from danger?","Ink",["Bubbles","Sand","Glue"],"Octopuses and squid squirt <b>ink</b> to make a dark cloud and swim away."],
  [4,"🐴","In which sea animal does the dad carry the babies until they are born?","The seahorse",["The shark","The clownfish","The eel"],"In <b>seahorses</b>, the dad carries the eggs in a pouch until the babies are born!"],
  [5,"🐙","How many hearts does an octopus have?","3",["1","2","8"],"An octopus has <b>3 hearts</b>, and its blood is blue!"],
  [5,"🌊","What is the deepest place in the ocean called?","The Mariana Trench",["The Bermuda Triangle","The Gulf of Mexico","The Dead Sea"],"<b>The Mariana Trench</b> in the Pacific is almost 7 miles deep. Mount Everest could fit inside!"],
  [5,"🐠","What is the biggest coral reef in the world, off the coast of Australia?","The Great Barrier Reef",["The Red Sea Reef","The Florida Reef","The Coral Castle"],"<b>The Great Barrier Reef</b> is so big you can see it from space!"],
 ]},
 { id: "dinos", name: "Dinosaurs", emoji: "🦖", intro: "Stomp, stomp! Let's learn about dinosaurs!", qs: [
  [1, "🦖", "Which dinosaur had tiny arms and big, sharp teeth?", "T. rex", ["Triceratops", "Stegosaurus", "Brachiosaurus"], "<b>T. rex</b> had tiny arms but huge, sharp teeth."],
  [1, "🦕", "Which dinosaur had three horns on its face?", "Triceratops", ["T. rex", "Stegosaurus", "Velociraptor"], "<b>Triceratops</b> had three horns. “Tri” means three!"],
  [2, "🥚", "What did baby dinosaurs hatch from?", "Eggs", ["Seeds", "Cocoons", "Bubbles"], "Baby dinosaurs hatched from <b>eggs</b>, just like baby birds."],
  [2, "🛡️", "Which dinosaur had big plates on its back and spikes on its tail?", "Stegosaurus", ["T. rex", "Triceratops", "Brachiosaurus"], "<b>Stegosaurus</b> had plates on its back and a spiky tail."],
  [3, "⛏️", "What do we call a scientist who studies dinosaur fossils?", "A paleontologist", ["An astronaut", "A veterinarian", "A weather reporter"], "A <b>paleontologist</b> digs up and studies fossils."],
  [3, "🦴", "What do we call the remains of ancient living things saved in rock?", "Fossils", ["Crystals", "Gems", "Pebbles"], "Bones and prints saved in rock are called <b>fossils</b>."],
  [4, "🏢", "Which long-necked dinosaur was taller than a four-story building?", "Brachiosaurus", ["Velociraptor", "Triceratops", "Ankylosaurus"], "<b>Brachiosaurus</b> had a super long neck to reach leaves at the tops of trees."],
  [4, "🐦", "Which animals alive today are related to dinosaurs?", "Birds", ["Cats", "Frogs", "Fish"], "<b>Birds</b> are living relatives of dinosaurs!"],
  [5, "☄️", "What most likely caused the dinosaurs to die out long ago?", "A giant asteroid hit Earth", ["Too much rain", "People hunted them", "They ate too much"], "Scientists think <b>a giant asteroid hit Earth</b> about 66 million years ago."],
  [5, "🦎", "What does the word “dinosaur” mean?", "Terrible lizard", ["Big monster", "Old bird", "Giant tooth"], "“Dinosaur” means <b>terrible lizard</b>."],
  [1,"🦕","What did long-necked dinosaurs like Apatosaurus eat?","Plants",["Meat","Fish","Rocks"],"Long-necked dinosaurs ate <b>plants</b>. Their long necks reached the tops of trees."],
  [2,"🦖","Did T. rex eat plants or meat?","Meat",["Plants","Only fruit","Only bugs"],"T. rex ate <b>meat</b>. It had about 60 teeth as big as bananas!"],
  [2,"🧍","Did people and dinosaurs live at the same time?","No",["Yes","Only cavemen","Only in Jurassic times"],"<b>No!</b> The dinosaurs died out about 66 million years before the first people."],
  [3,"🦃","Real Velociraptors were about the size of which animal?","A turkey",["An elephant","A horse","A school bus"],"Real Velociraptors were only about the size of <b>a turkey</b>, and they had feathers!"],
  [3,"🎯","What do we call an animal that hunts other animals for food?","A predator",["Prey","An herbivore","A pet"],"An animal that hunts is a <b>predator</b>. The animal it hunts is its prey."],
  [4,"🪖","Which dinosaur had a thick, dome-shaped skull, maybe for head-butting?","Pachycephalosaurus",["Ankylosaurus","Iguanodon","Allosaurus"],"<b>Pachycephalosaurus</b> had a skull up to 10 inches thick!"],
  [4,"🥚","Which dinosaur's name means “egg thief,” because scientists once thought it stole eggs?","Oviraptor",["Velociraptor","Maiasaura","Troodon"],"<b>Oviraptor</b> means egg thief. Later, scientists learned it was really protecting its own eggs!"],
  [5,"👍","Which plant-eating dinosaur had a big spike on each thumb?","Iguanodon",["Stegosaurus","Triceratops","Diplodocus"],"<b>Iguanodon</b> had thumb spikes. Scientists first thought the spike went on its nose!"],
  [5,"🦖","Which big meat-eater lived in the Jurassic period, millions of years before T. rex?","Allosaurus",["Spinosaurus","Giganotosaurus","Carnotaurus"],"<b>Allosaurus</b> lived in the Jurassic. T. rex came much later, in the Cretaceous."],
  [5,"🐂","Which meat-eating dinosaur had two horns above its eyes, like a bull?","Carnotaurus",["Triceratops","Allosaurus","Styracosaurus"],"<b>Carnotaurus</b> means “meat-eating bull.” It had horns and super tiny arms."],
 ]},
