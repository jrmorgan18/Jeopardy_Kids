/* ----- Clue ----- */
let current = null;
/* Grown-up questions (Family game): say the answer out loud, tap to show it, then tap whether you got it. */
function grownReveal(resEl, actEl, item, sayQ, onJudge) {
  actEl.innerHTML = `<button type="button" class="btn" data-g="show">👀 Show the answer</button>${canSpeak ? `<button type="button" class="btn alt small" data-g="speak">🔊 Read to me</button>` : ""}`;
  actEl.onclick = (e) => {
    const b = e.target.closest("[data-g]"); if (!b) return;
    const g = b.dataset.g;
    if (g === "speak") sayQ();
    else if (g === "show") {
      hush(); sndTap();
      const hint = resEl.parentNode.querySelector(".say-hint"); if (hint) hint.remove();
      resEl.innerHTML = `<div class="answer-box"><small>The answer is</small><b>${esc(item.a)}</b></div>`;
      actEl.innerHTML = `<button type="button" class="btn green" data-g="yes">✓ I got it</button><button type="button" class="btn red" data-g="no">✗ I missed it</button>`;
      if (prefs.read) speak("The answer is " + item.a + ". Did you get it?");
    } else { actEl.onclick = null; onJudge(g === "yes"); }
  };
}
/* Bets for a Daily Double or the Final: 0, a quarter, half, three quarters, or the most you can bet. */
function betOptions(max) {
  const names = ["Play it safe", "A quarter", "Half", "Three quarters", "All in!"];
  const out = [], seenV = new Set();
  [0, 0.25, 0.5, 0.75, 1].forEach((f, i) => {
    const v = f === 1 ? max : Math.round((max * f) / 100) * 100;
    if ((f > 0 && v <= 0) || v > max || seenV.has(v)) return;
    seenV.add(v); out.push({ v, t: names[i] });
  });
  return out;
}
const betButtons = (opts) => `<div class="wagers">${opts.map((o, i) => `<button type="button" class="btn ${i === opts.length - 1 && o.v > 0 ? "" : "alt"}" data-v="${o.v}">${o.t} (${o.v})</button>`).join("")}</div>`;
/* Daily Double: choose a bet first. You can bet up to your score, or up to double the square if you have less. */
function openStarBet(ci, ri) {
  const col = S.cols[ci], cl = col.clues[ri], cat = catById(col.cat);
  const player = S.players[S.turn], bot = isBot(player), multi = S.players.length > 1;
  const sc = player.score, max = Math.max(sc, cl.value * 2), opts = betOptions(max);
  current = { ci, ri, betting: true };
  $("clue").innerHTML = `
    <div class="clue-top"><span class="cat-pill ${COLORS[ci]}">${cat.emoji} ${esc(cat.name)}</span><span class="val">${cl.value} square</span></div>
    <div class="star-banner">⭐ Daily Double! ⭐</div>
    ${multi ? `<div class="who">${nameTag(player)}'s turn</div>` : ""}
    <p>${bot ? esc(player.name) + " has" : "You have"} <strong>${sc}</strong> points. ${bot ? "" : "How many do you want to bet? You can bet up to <strong>" + max + "</strong>."}</p>
    <p class="note">Right answer: win your bet. Miss: lose your bet.</p>
    <div id="clue-result">${bot ? `<div class="thinking">🤖 Choosing a bet<i>.</i><i>.</i><i>.</i></div>` : betButtons(opts)}</div>
    <div class="clue-actions" id="clue-actions"></div>`;
  $("modal").hidden = false;
  sndStar();
  const go = (v) => { hush(); sndTap(); openClue(ci, ri, false, v); };
  if (bot) {
    const o = botWager(sc, opts.filter((x) => x.v > 0));
    botWait(1800, () => {
      $("clue-result").querySelector(".thinking").textContent = `${player.name} bets ${o.v}!`;
      if (prefs.read) speak(player.name + " bets " + o.v + "!");
      botWait(1400, () => go(o.v));
    });
    if (prefs.read) speak("Daily Double!");
    return;
  }
  $("clue-result").onclick = (e) => { const b = e.target.closest("[data-v]"); if (b) { $("clue-result").onclick = null; go(+b.dataset.v); } };
  const first = $("clue-result").querySelector(".btn"); if (first) first.focus({ preventScroll: true });
  if (prefs.read) speak("Daily Double! " + (multi ? player.name + ", you" : "You") + " have " + sc + " points. How many do you want to bet? You can bet up to " + max + ".");
}
/* boost: a kid chose to try the grown-up question for triple points (Family game). bet: the Daily Double bet.
   who: the player answering (the picker, or the next player after a pass). passed: players who already passed this square. */
function openClue(ci, ri, boost, bet, who = S.turn, passed = []) {
  const col = S.cols[ci], cl = col.clues[ri], cat = catById(col.cat);
  const isStar = S.stars.some((s) => s.c === ci && s.r === ri);
  if (isStar && bet === undefined) return openStarBet(ci, ri);
  const player = S.players[who];
  const grown = !!(S.family && cl.p && (isGrown(player) || boost));
  const item = grown ? gk(cl.p) : qk(cl.k);
  const base = isStar ? bet : cl.value;
  const canBoost = !!(S.family && !grown && cl.p && !isBot(player) && base > 0);
  const say = !grown && !!S.say && !isBot(player) && !needsChoices(item); // kid says the answer out loud, no choices
  current = { ci, ri, item, grown, say, boost: !!boost, isStar, bet, who, passed, value: base * (boost ? 3 : 1), risk: base, order: grown ? [] : shuffle([item.a, ...item.w]) };
  const multi = S.players.length > 1;
  const passer = passed.length ? S.players[passed[passed.length - 1]] : null;
  const passBtn = isBot(player) ? "" : `<button type="button" class="btn alt small" id="clue-pass">🙅 Pass</button>`;
  $("clue").innerHTML = `
    <div class="clue-top"><span class="cat-pill ${COLORS[ci]}">${cat.emoji} ${esc(cat.name)}</span><span class="val">${current.value} points</span></div>
    ${isStar ? `<div class="star-banner">⭐ Daily Double! You bet ${bet}! ⭐</div>` : ""}
    ${multi ? `<div class="who">${nameTag(player)}'s turn${passer ? ` <small>${esc(passer.name)} passed. Your chance!</small>` : ""}</div>` : ""}
    ${boost ? `<div class="star-banner boost">🦸 Grown-up question · Triple points! 🦸</div>` : grown ? `<span class="grown-tag">Grown-up question</span>` : ""}
    <p class="q" id="clue-q">${esc(item.text)}</p>
    ${grown || say ? `<p class="say-hint">${boost ? "Say your answer out loud. Then a grown-up can show the answer and check it!" : "Say your answer out loud, then show the answer."}</p>` : `<div class="choices" id="choices">
      ${current.order.map((c, i) => `<button type="button" class="choice" data-i="${i}"><span class="k">${"ABCD"[i]}</span><span>${esc(c)}</span></button>`).join("")}
    </div>`}
    <div id="clue-result"></div>
    <div class="clue-actions" id="clue-actions">
      ${canSpeak ? `<button type="button" class="btn alt small" id="clue-speak">🔊 Read to me</button>` : ""}
      ${canBoost ? `<button type="button" class="btn small boost" id="clue-boost">🦸 Try the grown-up question for ${base * 3}!${isStar || losesPoints(player) ? ` (miss = −${base})` : ""}</button>` : ""}
      ${passBtn}
    </div>`;
  $("modal").hidden = false;
  if (boost) sndStar(); else sndTap();
  const sayQ = () => speak(grown || say ? item.text : item.text + " " + current.order.map((c, i) => "ABCD"[i] + ". " + c + ".").join(" "));
  if (prefs.read) setTimeout(() => { if (passer) speak(passer.name + " passed. " + player.name + ", your chance! "); sayQ(); }, 150);
  if (grown || say) {
    grownReveal($("clue-result"), $("clue-actions"), item, sayQ, settle);
    // The boost and pass buttons go away once the answer is shown
    if (canBoost) { $("clue-actions").insertAdjacentHTML("beforeend", `<button type="button" class="btn small boost" id="clue-boost">🦸 Try the grown-up question for ${base * 3}!${isStar || losesPoints(player) ? ` (miss = −${base})` : ""}</button>`); $("clue-boost").onclick = () => { hush(); openClue(ci, ri, true, bet, who, passed); }; }
    if (passBtn) { $("clue-actions").insertAdjacentHTML("beforeend", passBtn); $("clue-pass").onclick = passClue; }
    $("clue-actions").querySelector(".btn").focus({ preventScroll: true });
    return;
  }
  if ($("clue-speak")) $("clue-speak").onclick = sayQ;
  if ($("clue-pass")) $("clue-pass").onclick = passClue;
  if ($("clue-boost")) $("clue-boost").onclick = () => { hush(); openClue(ci, ri, true, bet, who, passed); };
  $("choices").onclick = (e) => { const b = e.target.closest(".choice"); if (b && !current.answered) answer(+b.dataset.i); };
  if (isBot(player)) {
    $("choices").classList.add("locked");
    $("clue-result").innerHTML = `<div class="thinking">🤖 ${esc(BOT_NAME)} is thinking<i>.</i><i>.</i><i>.</i></div>`;
    const sayText = item.text + " " + current.order.join(" ");
    botWait(readTime(sayText), () => {
      const right = current.order.indexOf(item.a);
      const i = botGetsIt(ri) ? right : pick([0, 1, 2, 3].filter((j) => j !== right));
      $("choices").children[i].classList.add("bot-pick");
      botWait(900, () => answer(i));
    });
    return;
  }
  const first = $("clue").querySelector(".choice"); if (first) first.focus({ preventScroll: true });
}
function answer(i) {
  current.answered = true;
  $("choices").querySelectorAll(".choice").forEach((b, j) => {
    b.disabled = true;
    if (current.order[j] === current.item.a) b.classList.add("right");
    else if (j === i) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  settle(current.order[i] === current.item.a);
}
/* Score the square and show the result (kid, grown-up, or Robo). */
function settle(ok) {
  current.answered = true;
  const cl = S.cols[current.ci].clues[current.ri];
  cl.done = true; cl.ok = ok; cl.by = current.who;
  const player = S.players[current.who], bot = isBot(player), grown = current.grown;
  if (grown) { grownSeen.add(current.item.key); save("bb-gseen", [...grownSeen]); }
  else if (!bot) { seen.delete(current.item.key); seen.add(current.item.key); save("bb-seen", [...seen]); }
  const lose = !ok && current.risk > 0 && (current.isStar || losesPoints(player));
  if (ok) player.score += current.value; else if (lose) player.score -= current.risk; // a miss costs the square (or the Daily Double bet), never the triple
  const multi = S.players.length > 1;
  const adult = isGrown(player);
  const head = bot ? (ok ? `${BOT_NAME} got it!` : `${BOT_NAME} missed it!`) : ok ? (current.boost ? "WOW! You beat a grown-up question!" : pick(adult ? GROWN_CHEERS : CHEERS)) : pick(adult ? GROWN_COMFORT : COMFORT);
  const sub = ok ? `+${current.value} points${multi ? " for " + esc(player.name) : ""}!${current.boost ? " Triple points!" : ""}`
    : ((grown || current.say ? (lose ? "" : "No points this time.") : `The answer is <b>${esc(current.item.a)}</b>.`) + (lose ? ` −${current.risk} points.` : "")).trim();
  const shown = grown || current.say ? $("clue-result").innerHTML : "";
  $("clue-result").innerHTML = shown + `<div class="result ${ok ? "ok" : "no"}"><h3>${bot ? "🤖 " : ok ? "🎉 " : "💡 "}${head}</h3><p>${sub}</p>${grown ? "" : `<p>${current.item.f}</p>`}</div>`;
  $("clue-actions").innerHTML = `<button type="button" class="btn green" id="clue-done">Back to the board ▶</button>`;
  $("clue-done").onclick = closeClue;
  $("clue-done").focus({ preventScroll: true });
  if (ok) { sndRight(); if (!bot) confetti(current.boost ? 280 : current.isStar ? 220 : 110); } else sndWrong();
  if (prefs.read) speak(head + (grown ? "" : " " + (ok || current.say ? "" : "The answer is " + current.item.a + ". ") + plain(current.item.f)));
}
/* Pass: no points won or lost. The next player who hasn't passed gets their own version of the question.
   A Daily Double belongs to the picker only, so passing it (or everyone passing) leaves the square unanswered. */
function passClue() {
  if (!current || current.answered) return;
  hush(); sndTap();
  const { ci, ri, who, isStar } = current, passed = current.passed.concat(who);
  const n = S.players.length;
  let next = -1;
  if (!isStar) for (let k = 1; k < n; k++) { const j = (who + k) % n; if (!passed.includes(j)) { next = j; break; } }
  if (next >= 0) return openClue(ci, ri, false, undefined, next, passed);
  current.answered = true;
  const cl = S.cols[ci].clues[ri];
  cl.done = true; cl.ok = null; cl.by = null;
  const multi = n > 1 && !isStar;
  const head = multi ? "Everybody passed!" : "You passed!";
  const hint = $("clue").querySelector(".say-hint"); if (hint) hint.remove();
  if ($("choices")) $("choices").querySelectorAll(".choice").forEach((b, j) => { b.disabled = true; b.classList.add(current.order[j] === current.item.a ? "right" : "dim"); });
  $("clue-result").innerHTML = `<div class="result pass"><h3>🙅 ${head}</h3><p>No points won or lost. The answer is <b>${esc(current.item.a)}</b>.</p>${current.grown ? "" : `<p>${current.item.f}</p>`}</div>`;
  $("clue-actions").innerHTML = `<button type="button" class="btn green" id="clue-done">Back to the board ▶</button>`;
  $("clue-done").onclick = closeClue;
  $("clue-done").focus({ preventScroll: true });
  if (prefs.read) speak(head + " The answer is " + current.item.a + ". " + (current.grown ? "" : plain(current.item.f)));
}
function closeClue() {
  hush();
  botCancel();
  $("modal").hidden = true;
  S.turn = (S.turn + 1) % S.players.length;
  current = null;
  const left = S.cols.some((c) => c.clues.some((cl) => !cl.done));
  if (left) renderBoard(); else if (S.round === 1) startRoundBreak(); else startFinal();
}

/* ----- Between rounds: Double Jeopardy or straight to the Final Jeopardy ----- */
function startRoundBreak() { show("final"); S.screen = "break"; renderRoundBreak(); }
function renderRoundBreak() {
  const multi = S.players.length > 1;
  const ranked = S.players.slice().sort((a, b) => b.score - a.score);
  const top = ranked[0].score;
  $("final-card").innerHTML = `<div class="trophy" aria-hidden="true">🎉</div><h2>Round 1 done!</h2>
    ${multi
      ? `<div class="podium">${ranked.map((r) => `<div class="row ${r.score === top ? "win" : ""}"><span aria-hidden="true">${r.score === top ? "🥇" : "⭐"}</span><span class="nm">${nameTag(r)}</span><span class="pts">${r.score}</span></div>`).join("")}</div>`
      : `<p>You have <strong>${S.players[0].score}</strong> points!</p>`}
    <p>What's next?</p>
    <div class="next-choices">
      <button type="button" class="next-choice" id="go-double">
        <b>Double Jeopardy ▶</b><span>New topics, every square is worth double, and 2 Daily Double squares!</span>
      </button>
      <button type="button" class="next-choice alt" id="go-final">
        <b>Final Jeopardy ⭐</b><span>Skip ahead to the last question.</span>
      </button>
    </div>`;
  $("go-double").onclick = () => { sndTap(); startDoubleRound(); };
  $("go-final").onclick = () => { sndTap(); startFinal(); };
  if (prefs.read) speak("Round 1 is done! Do you want to play the Double Jeopardy, or go to the Final Jeopardy?");
}

/* ----- Final Jeopardy ----- */
function startFinal() { S.final.step = 0; S.final.player = 0; S.final.wagers = []; S.final.answers = []; S.final.order = null; show("final"); renderFinal(); }
function wagerOptions(sc) {
  return sc > 0 ? betOptions(sc) : [{ v: 500, t: "Free try!" }];
}
function botWager(sc, opts) {
  if (sc <= 0 || opts.length === 1) return opts[0];
  if (prefs.botLevel === "easy") return pick(opts);
  const best = Math.max(0, ...S.players.filter((p) => !isBot(p)).map((p) => p.score));
  const mid = opts[Math.floor(opts.length / 2)];
  if (prefs.botLevel === "hard") return sc > best * 2 ? opts[1] : sc <= best ? opts[opts.length - 1] : mid;
  return mid;
}
function renderFinal() {
  const F = S.final, cat = catById(F.cat), card = $("final-card");
  const multi = S.players.length > 1;
  if (F.step === 0) {
    card.innerHTML = `<div class="trophy" aria-hidden="true">⭐</div><h2>The Final Jeopardy!</h2>
      <p>One last question about <strong>${cat.emoji} ${esc(cat.name)}</strong>. First, choose how many points to bet.</p>
      ${S.family ? `<p class="note">Kids get a kid question. Grown-ups get a grown-up question.</p>` : ""}
      <button type="button" class="btn big" id="f-go">Let's do it! ▶</button>`;
    $("f-go").onclick = () => { F.step = 1; renderFinal(); };
    if (prefs.read) speak("The Final Jeopardy! One last question about " + cat.name + ". First, choose how many points to bet.");
    return;
  }
  const p = S.players[F.player], bot = isBot(p);
  const grown = !!(S.family && isGrown(p) && F.p);
  const item = grown ? gk(F.p) : qk(F.k);
  const say = !grown && !!S.say && !bot && !needsChoices(item);
  if (F.step === 1) {
    const sc = p.score, opts = wagerOptions(sc);
    const choose = (o) => { F.wagers[F.player] = { v: o.v, free: sc <= 0 }; F.step = 2; sndTap(); renderFinal(); };
    if (bot) {
      card.innerHTML = `<h2>🤖 ${esc(p.name)}'s bet</h2><p>${esc(p.name)} has <strong>${sc}</strong> points.</p>
        <div class="thinking">Choosing a bet<i>.</i><i>.</i><i>.</i></div>`;
      const o = botWager(sc, opts);
      botWait(1800, () => {
        card.querySelector(".thinking").textContent = `${p.name} bets ${o.v}!`;
        if (prefs.read) speak(p.name + " bets " + o.v + "!");
        botWait(1600, () => choose(o));
      });
      return;
    }
    card.innerHTML = `<h2>${multi ? esc(p.name) + ", place your bet" : "Place your bet"}</h2>
      <p>You have <strong>${sc}</strong> points. If you're right, you win your bet. If you miss, you lose it.</p>
      ${betButtons(opts)}
      ${sc > 0 ? "" : `<p class="note">No points yet? This one is a free try. You can't lose anything!</p>`}`;
    card.querySelector(".wagers").onclick = (e) => {
      const b = e.target.closest("[data-v]"); if (!b) return;
      choose(opts.find((o) => o.v === +b.dataset.v));
    };
    if (prefs.read) speak((multi ? p.name + ", " : "") + "place your bet. You have " + sc + " points.");
    return;
  }
  if (F.step === 2) {
    const order = grown || say ? [] : F.order || (F.order = shuffle([item.a, ...item.w]));
    card.innerHTML = `<span class="cat-pill">${cat.emoji} ${esc(cat.name)} · ${multi ? nameTag(p) + " · " : ""}bet ${F.wagers[F.player].v}</span>
      ${grown ? `<span class="grown-tag">Grown-up question</span>` : ""}
      <p class="q" id="clue-q">${esc(item.text)}</p>
      ${grown || say ? `<p class="say-hint">Say your answer out loud, then show the answer.</p>`
        : `<div class="choices" id="f-choices">${order.map((c, i) => `<button type="button" class="choice" data-i="${i}"><span class="k">${"ABCD"[i]}</span><span>${esc(c)}</span></button>`).join("")}</div>`}
      <div id="f-result" style="width:100%"></div><div class="clue-actions" id="f-actions">${canSpeak ? `<button type="button" class="btn alt small" id="f-speak">🔊 Read to me</button>` : ""}</div>`;
    const sayText = grown || say ? item.text : item.text + " " + order.map((c, i) => "ABCD"[i] + ". " + c + ".").join(" ");
    const sayQ = () => speak(sayText);
    if ($("f-speak")) $("f-speak").onclick = sayQ;
    if (prefs.read) setTimeout(sayQ, 150);
    const settleFinal = (ok) => {
      if (F.answers[F.player] !== undefined) return;
      const w = F.wagers[F.player];
      F.answers[F.player] = ok;
      if (ok) p.score += w.v; else if (!w.free) p.score -= w.v;
      if (grown) { grownSeen.add(item.key); save("bb-gseen", [...grownSeen]); }
      const head = bot ? (ok ? `${p.name} got it!` : `${p.name} missed it!`) : ok ? pick(grown ? GROWN_CHEERS : CHEERS) : pick(grown ? GROWN_COMFORT : COMFORT);
      const shown = grown || say ? $("f-result").innerHTML : "";
      $("f-result").innerHTML = shown + `<div class="result ${ok ? "ok" : "no"}"><h3>${bot ? "🤖 " : ok ? "🎉 " : "💡 "}${head}</h3>
        <p>${ok ? `+${w.v} points!` : w.free || w.v === 0 ? "No points lost." : `−${w.v} points.`}</p>${grown ? "" : `<p>${item.f}</p>`}</div>`;
      const more = F.player < S.players.length - 1;
      $("f-actions").innerHTML = `<button type="button" class="btn green" id="f-next">${more ? `${nameTag(S.players[F.player + 1])}'s turn ▶` : "See who won! 🏆"}</button>`;
      $("f-next").onclick = () => { hush(); botCancel(); if (more) { F.player++; F.step = 1; } else F.step = 3; renderFinal(); };
      if (ok) { sndRight(); if (!bot) confetti(160); } else sndWrong();
      if (prefs.read) speak(head + (grown ? "" : " " + (ok || say ? "" : "The answer is " + item.a + ". ") + plain(item.f)));
    };
    const finalAnswer = (i) => {
      if (F.answers[F.player] !== undefined) return;
      $("f-choices").querySelectorAll(".choice").forEach((x, j) => {
        x.disabled = true;
        if (order[j] === item.a) x.classList.add("right"); else if (j === i) x.classList.add("wrong"); else x.classList.add("dim");
      });
      settleFinal(order[i] === item.a);
    };
    if (grown || say) {
      grownReveal($("f-result"), $("f-actions"), item, sayQ, settleFinal);
    } else if (bot) {
      $("f-choices").classList.add("locked");
      $("f-result").innerHTML = `<div class="thinking">🤖 ${esc(p.name)} is thinking<i>.</i><i>.</i><i>.</i></div>`;
      botWait(readTime(sayText), () => {
        const right = order.indexOf(item.a);
        const i = botGetsIt(4) ? right : pick([0, 1, 2, 3].filter((j) => j !== right));
        $("f-choices").children[i].classList.add("bot-pick");
        botWait(900, () => finalAnswer(i));
      });
    } else {
      $("f-choices").onclick = (e) => { const b = e.target.closest(".choice"); if (b) finalAnswer(+b.dataset.i); };
    }
    return;
  }
  // step 3: results
  const allCols = S.past.concat(S.cols), boardTotal = allCols.length * 5;
  const rightBy = (i) => allCols.reduce((n, c) => n + c.clues.filter((cl) => cl.ok && cl.by === i).length, 0);
  const ranked = S.players.map((pl, i) => ({ ...pl, i, right: rightBy(i) })).sort((a, b) => b.score - a.score);
  const top = ranked[0].score;
  const winners = ranked.filter((r) => r.score === top);
  const botWon = winners.length === 1 && isBot(winners[0]);
  const title = !multi ? "Great game!" : winners.length > 1 ? "It's a tie!" : `${esc(winners[0].name)} wins!`;
  card.innerHTML = `<div class="trophy" aria-hidden="true">${botWon ? "🤖" : "🏆"}</div><h2>${title}</h2>
    ${!multi ? `<p>You finished with <strong>${S.players[0].score}</strong> points and got <strong>${ranked[0].right} of ${boardTotal}</strong> board questions right!</p>` : ""}
    ${botWon ? `<p>Robo won this time. Play again and see if you can beat Robo!</p>` : ""}
    ${multi ? `<div class="podium">${ranked.map((r) => `<div class="row ${r.score === top ? "win" : ""}"><span aria-hidden="true">${r.score === top ? "🥇" : "⭐"}</span><span class="nm">${nameTag(r)}<small>${r.right} board questions right</small></span><span class="pts">${r.score}</span></div>`).join("")}</div>` : ""}
    <div class="clue-actions">
      <button type="button" class="btn big" id="again">📚 New game</button>
      <button type="button" class="btn alt" id="home">🏠 Home</button>
    </div>`;
  $("again").onclick = () => { newGame(); startLesson(); };
  $("home").onclick = () => { S = null; show("home"); renderHome(); };
  if (!botWon) { confetti(260); tone([523, 659, 784, 1047, 784, 1047], 0.2, "triangle", 0.14); }
  if (prefs.read) speak(plain(title) + (!multi ? " You finished with " + S.players[0].score + " points." : botWon ? " Play again and see if you can beat Robo!" : ""));
}

/* ===== Boot (keeps a game in progress across page updates) ===== */
function start(data) {
  renderHome();
  if (data && data.S && data.S.cols) {
    S = data.S;
    // Games saved before the Double Jeopardy existed
    S.round = S.round || 1; S.past = S.past || []; S.stars = S.stars || (S.star ? [S.star] : []);
    // Games saved before squares stored question keys
    S.past.concat(S.cols).forEach((col) => col.clues.forEach((cl) => { if (!cl.k) cl.k = col.cat + "-" + cl.idx; }));
    if (!S.final.k) S.final.k = S.final.cat + "-" + S.final.idx;
    if (S.screen === "lesson") { show("lesson"); renderLesson(); }
    else if (S.screen === "break") startRoundBreak();
    else if (S.screen === "final") { show("final"); renderFinal(); }
    else startBoard();
  } else show("home");
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
