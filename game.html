<title>Kids Jeopardy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Lexend:wght@400;500;700&display=swap">
<style>
/* Layout: one screen at a time (home → lesson → board → big finish). TV game-show look: blue cells on a black grid, gold values, white caps. */
:root {
  --night: #040A33;
  --night-dot: #0B1552;
  --blue: #0A1BA6;
  --blue-hi: #1B32D2;
  --blue-deep: #06106B;
  --line: #000000;
  --gold: #FFC72C;
  --white: #FFFFFF;
  --soft: #C3CCFF;
  --right: #1E9E5A;
  --wrong: #7A1F2B;
  --right-bg: #0E5A36;
  --wrong-bg: #551520;
  --font-display: "Oswald", "Arial Narrow", "Helvetica Neue", Impact, sans-serif;
  --font-body: "Lexend", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 10px;
  --stick: 0 6px 0 var(--line);
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background-color: var(--night);
  background-image: radial-gradient(var(--night-dot) 2px, transparent 2.5px);
  background-size: 28px 28px;
  color: var(--white);
  font-family: var(--font-body);
  font-size: 17px;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 4px solid var(--gold); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .02em; text-wrap: balance; margin: 0; line-height: 1.05; }

.wrap {
  min-height: 100%;
  box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 28px;
  max-width: 1180px;
  margin: 0 auto;
}

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5em;
  border: 3px solid var(--line); border-radius: var(--r);
  background: var(--gold); color: var(--line);
  font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; text-transform: uppercase; letter-spacing: .03em;
  padding: .4em 1.2em .38em; box-shadow: var(--stick);
  transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--line); }
.btn[disabled] { opacity: .5; cursor: default; }
.btn.big { font-size: 1.7rem; padding: .45em 1.5em .42em; }
.btn.ghost { background: transparent; color: var(--white); border-color: var(--soft); box-shadow: none; font-size: 1.05rem; }
.btn.ghost:active { transform: translateY(2px); }
.btn.alt { background: var(--blue-hi); color: var(--white); }
.btn.green { background: var(--right); color: var(--white); }
.btn.small { font-size: 1rem; padding: .32em .9em .3em; box-shadow: 0 4px 0 var(--line); }

/* ---------- HOME ---------- */
.logo { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 10px 0 22px; }
.logo-word {
  font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .02em;
  font-size: clamp(3.2rem, 11vw, 6rem); line-height: .95; color: var(--gold);
  text-shadow: 4px 4px 0 var(--line), 0 0 30px rgba(255, 199, 44, .25);
  display: flex; flex-wrap: wrap; justify-content: center; gap: 0 .3em;
}
.logo-tag { color: var(--soft); font-size: 1.05rem; text-align: center; margin: 0; }

.setup { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 18px; max-width: 1100px; margin: 0 auto; }
.panel { background: var(--blue-deep); color: var(--white); border: 3px solid var(--line); border-radius: var(--r); box-shadow: var(--stick); padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel h2 { font-size: 1.6rem; color: var(--gold); text-shadow: 2px 2px 0 var(--line); }
.panel .hint { color: var(--soft); font-size: .92rem; margin: -6px 0 0; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip {
  border: 3px solid var(--line); border-radius: 8px; background: var(--blue); color: var(--white);
  padding: 7px 14px 6px; font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; line-height: 1.15; text-transform: uppercase; letter-spacing: .02em;
  display: flex; flex-direction: column; align-items: flex-start; text-align: left;
}
.chip small { font-family: var(--font-body); font-weight: 400; font-size: .76rem; color: var(--soft); text-transform: none; letter-spacing: 0; }
.chip[aria-pressed="true"] { background: var(--gold); color: var(--line); box-shadow: 0 4px 0 var(--line); }
.chip[aria-pressed="true"] small { color: var(--line); }
.chip.round { min-width: 52px; align-items: center; }
.names { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.names input {
  width: 100%; box-sizing: border-box; font: inherit; font-size: 1.1rem; color: var(--line);
  border: 3px solid var(--line); border-radius: 8px; padding: 8px 12px; background: var(--white);
}
.toggle { display: flex; align-items: center; gap: 12px; background: var(--blue); border: 3px solid var(--line); border-radius: 8px; padding: 10px 14px; text-align: left; color: var(--white); }
.toggle .knob { flex: none; width: 52px; height: 30px; border-radius: 999px; border: 3px solid var(--line); background: var(--blue-deep); position: relative; transition: background .15s; }
.toggle .knob::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--white); border: 2px solid var(--line); transition: left .15s; }
.toggle[aria-pressed="true"] .knob { background: var(--gold); }
.toggle[aria-pressed="true"] .knob::after { left: 24px; }
.toggle b { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; text-transform: uppercase; letter-spacing: .02em; display: block; }
.toggle span.t { font-size: .85rem; color: var(--soft); }
.start-row { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 26px; }

/* ---------- LESSON ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.topbar h2 { font-size: clamp(1.4rem, 3.5vw, 2rem); color: var(--gold); text-shadow: 2px 2px 0 var(--line); }
.progress { flex: 1 1 200px; height: 16px; border-radius: 999px; background: var(--blue-deep); border: 3px solid var(--line); overflow: hidden; min-width: 120px; }
.progress i { display: block; height: 100%; background: var(--gold); width: 0; transition: width .3s; }
.lesson-card {
  background: var(--blue); color: var(--white); border: 4px solid var(--line); border-radius: 14px; box-shadow: 0 8px 0 var(--line);
  max-width: 820px; margin: 0 auto; padding: clamp(18px, 4vw, 36px); display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;
  min-height: min(56vh, 460px); justify-content: center; box-sizing: border-box;
}
.cat-pill { font-family: var(--font-display); font-weight: 600; font-size: 1rem; letter-spacing: .06em; text-transform: uppercase; border: 3px solid var(--line); border-radius: 6px; padding: 3px 12px 2px; background: var(--gold); color: var(--line); }
.lesson-card .pic { font-size: clamp(4rem, 14vw, 7rem); line-height: 1; }
.lesson-card .fact { font-size: clamp(1.3rem, 3.4vw, 2rem); line-height: 1.4; max-width: 30ch; margin: 0; text-shadow: 2px 2px 0 var(--line); }
.lesson-card .fact b { background: var(--gold); color: var(--line); text-shadow: none; padding: 0 .2em; border-radius: 4px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.lesson-card .peek { font-size: .98rem; color: var(--soft); max-width: 46ch; margin: 0; }
.lesson-card .peek strong { color: var(--white); }
.lesson-card h3 { font-size: clamp(2.2rem, 6vw, 3.4rem); color: var(--gold); text-shadow: 3px 3px 0 var(--line); }
.lesson-nav { display: flex; justify-content: center; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 22px; }

/* ---------- BOARD ---------- */
.scores { display: flex; flex-wrap: wrap; gap: 10px; flex: 1 1 auto; }
.score {
  display: flex; align-items: center; gap: 10px; background: var(--blue-deep); border: 3px solid var(--line); border-radius: 8px; padding: 5px 14px 4px;
  font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; text-transform: uppercase; color: var(--soft);
}
.score .pts { font-size: 1.5rem; color: var(--white); font-variant-numeric: tabular-nums; }
.score.turn { background: var(--gold); color: var(--line); box-shadow: 0 4px 0 var(--line); }
.score.turn .pts { color: var(--line); }
.turn-line { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; font-size: clamp(1.2rem, 3vw, 1.6rem); text-align: center; margin: 4px 0 12px; }
.board {
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: clamp(4px, .8vw, 8px);
  background: var(--line); border: clamp(4px, .8vw, 8px) solid var(--line); border-radius: 6px; box-shadow: 0 0 0 2px var(--blue-deep), 0 10px 30px rgba(0, 0, 0, .5);
}
.board.locked { pointer-events: none; }
.col { display: grid; grid-template-rows: auto repeat(5, 1fr); gap: clamp(4px, .8vw, 8px); min-width: 0; }
.cat-head {
  background: var(--blue); color: var(--white); border-radius: 2px; margin-bottom: clamp(4px, .8vw, 8px);
  min-height: clamp(70px, 13vh, 112px); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 4px; text-align: center;
}
.cat-head .e { font-size: clamp(1.3rem, 3.2vw, 2rem); line-height: 1; }
.cat-head .n { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .02em; font-size: clamp(.8rem, 2vw, 1.3rem); line-height: 1.05; overflow-wrap: anywhere; margin-top: 4px; text-shadow: 2px 2px 0 var(--line); }
.tile {
  border: 0; border-radius: 2px; background: var(--blue); color: var(--gold);
  height: clamp(56px, 11vh, 104px); font-family: var(--font-display); font-weight: 700; font-size: clamp(1.4rem, 4.6vw, 3rem);
  text-shadow: 3px 3px 0 var(--line); font-variant-numeric: tabular-nums; padding: 0; transition: background .1s;
}
.tile:active { background: var(--blue-hi); }
.tile.bot-pick { background: var(--blue-hi); outline: 4px solid var(--gold); outline-offset: -4px; }
.tile.done { background: var(--blue-deep); color: var(--soft); text-shadow: none; font-size: clamp(1rem, 2.6vw, 1.5rem); cursor: default; }
.board-foot { display: flex; justify-content: center; margin-top: 22px; }
.round-tag { margin: 0 auto 6px; width: fit-content; font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: 1rem; color: var(--soft); border: 2px solid var(--soft); border-radius: 6px; padding: 2px 12px 1px; }
.round-tag.double { color: var(--line); background: var(--gold); border-color: var(--line); box-shadow: 0 3px 0 var(--line); font-size: 1.15rem; }

/* Round break choices */
.next-choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 14px; width: 100%; }
.next-choice {
  display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center; min-width: 0;
  border: 3px solid var(--line); border-radius: var(--r); box-shadow: var(--stick); padding: 16px 16px 14px;
  background: var(--gold); color: var(--line); transition: transform .08s, box-shadow .08s;
}
.next-choice b { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .03em; font-size: 1.6rem; }
.next-choice span { font-size: .98rem; line-height: 1.35; }
.next-choice.alt { background: var(--blue-hi); color: var(--white); }
.next-choice:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--line); }

/* ---------- CLUE MODAL ---------- */
.modal { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .8); display: flex; align-items: center; justify-content: center; overflow-y: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.clue {
  background: var(--blue); color: var(--white); border: 4px solid var(--line); border-radius: 14px; box-shadow: 0 8px 0 var(--line);
  width: 100%; max-width: 820px; padding: clamp(16px, 3.5vw, 32px); box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; margin: auto;
  animation: pop .25s ease-out;
}
@keyframes pop { from { transform: scale(.85); opacity: .4; } to { transform: scale(1); opacity: 1; } }
.clue-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.clue-top .val { font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; color: var(--gold); text-shadow: 2px 2px 0 var(--line); }
.star-banner { background: var(--gold); color: var(--line); border: 3px solid var(--line); border-radius: 8px; text-align: center; font-family: var(--font-display); font-weight: 700; text-transform: uppercase; font-size: clamp(1.3rem, 3.5vw, 1.8rem); padding: 4px 10px 2px; }
.who { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; font-size: 1.2rem; color: var(--soft); text-align: center; }
.q { font-size: clamp(1.45rem, 4vw, 2.35rem); line-height: 1.3; text-align: center; margin: 0; font-weight: 500; text-shadow: 2px 2px 0 var(--line); }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; width: 100%; }
@media (max-width: 560px) { .choices { grid-template-columns: 1fr; } }
.choices.locked { pointer-events: none; }
.choice {
  border: 3px solid var(--line); border-radius: 10px; background: var(--blue-deep); box-shadow: 0 5px 0 var(--line); color: var(--white);
  font-size: clamp(1.1rem, 2.8vw, 1.45rem); font-weight: 500; padding: 14px 14px 12px; text-align: left; display: flex; gap: 12px; align-items: center; min-height: 64px;
}
.choice .k { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--line); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; background: var(--gold); color: var(--line); font-size: 1.1rem; }
.choice:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
.choice.right { background: var(--right); }
.choice.wrong { background: var(--wrong); text-decoration: line-through; text-decoration-thickness: 2px; }
.choice.bot-pick { outline: 4px solid var(--gold); outline-offset: 2px; }
.choice[disabled] { cursor: default; }
.choice.dim { opacity: .45; }
.result { border: 3px solid var(--line); border-radius: 10px; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; text-align: center; }
.result.ok { background: var(--right-bg); }
.result.no { background: var(--wrong-bg); }
.result h3 { font-size: clamp(1.6rem, 4.5vw, 2.4rem); color: var(--gold); text-shadow: 2px 2px 0 var(--line); }
.result p { margin: 0; font-size: 1.1rem; line-height: 1.45; }
.result p b { background: var(--gold); color: var(--line); padding: 0 .2em; border-radius: 4px; }
.thinking { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; font-size: 1.4rem; text-align: center; color: var(--gold); }
.thinking i { display: inline-block; animation: blink 1.2s infinite; font-style: normal; }
.thinking i:nth-child(2) { animation-delay: .2s; } .thinking i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
.clue-actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }

/* ---------- FINAL & END ---------- */
.center-card { background: var(--blue); color: var(--white); border: 4px solid var(--line); border-radius: 14px; box-shadow: 0 8px 0 var(--line);
  max-width: 760px; margin: 30px auto 0; padding: clamp(18px, 4vw, 36px); display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; box-sizing: border-box; }
.center-card h2 { font-size: clamp(2.2rem, 6vw, 3.4rem); color: var(--gold); text-shadow: 3px 3px 0 var(--line); }
.center-card p { margin: 0; font-size: 1.2rem; line-height: 1.45; max-width: 36ch; }
.center-card .note { font-size: 1rem; color: var(--soft); }
.wagers { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.podium { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 460px; }
.podium .row { display: flex; align-items: center; gap: 12px; border: 3px solid var(--line); border-radius: 8px; padding: 8px 14px 6px; background: var(--blue-deep); font-family: var(--font-display); font-weight: 600; text-transform: uppercase; font-size: 1.4rem; }
.podium .row.win { background: var(--gold); color: var(--line); box-shadow: 0 4px 0 var(--line); }
.podium .row .nm { flex: 1; text-align: left; min-width: 0; overflow-wrap: anywhere; }
.podium .row .nm small { display: block; font-family: var(--font-body); font-weight: 400; text-transform: none; font-size: .85rem; opacity: .8; }
.podium .row .pts { font-variant-numeric: tabular-nums; }
.trophy { font-size: clamp(4rem, 14vw, 6.5rem); line-height: 1; }

#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 40; width: 100%; height: 100%; }
@media (prefers-reduced-motion: reduce) { .clue { animation: none; } .progress i { transition: none; } .thinking i { animation: none; opacity: 1; } }
</style>

<canvas id="confetti" aria-hidden="true"></canvas>

<main class="wrap" id="app">
  <!-- HOME -->
  <section id="scr-home">
    <div class="logo">
      <div class="logo-word" aria-label="Kids Jeopardy"><span>Kids</span><span>Jeopardy</span></div>
      <p class="logo-tag">Learn the facts, then play the board!</p>
    </div>
    <div class="setup">
      <div class="panel">
        <h2>Who's playing?</h2>
        <div class="chips" id="player-count" role="group" aria-label="Number of players"></div>
        <div class="names" id="names"></div>
        <button class="toggle" id="bot-toggle" type="button" aria-pressed="false">
          <span class="knob" aria-hidden="true"></span>
          <span><b>🤖 Play against the computer</b><span class="t">Robo the robot joins the game</span></span>
        </button>
        <div class="chips" id="bot-levels" role="group" aria-label="Computer level"></div>
      </div>
      <div class="panel">
        <h2>How tricky?</h2>
        <p class="hint">Easy questions are worth 100. The hardest are worth 500.</p>
        <div class="chips" id="levels" role="group" aria-label="Grade level"></div>
        <button class="toggle" id="read-toggle" type="button" aria-pressed="true">
          <span class="knob" aria-hidden="true"></span>
          <span><b>Read questions out loud</b><span class="t">Great for new readers</span></span>
        </button>
      </div>
      <div class="panel">
        <h2>Topics</h2>
        <p class="hint">Favorites are books, sports, movies, and TV.</p>
        <div class="chips" id="topics" role="group" aria-label="Topics"></div>
      </div>
    </div>
    <div class="start-row">
      <button class="btn big" id="go-lesson" type="button">📚 Start the Lesson</button>
      <button class="btn ghost" id="go-play" type="button">Skip the lesson and play</button>
    </div>
  </section>

  <!-- LESSON -->
  <section id="scr-lesson" hidden>
    <div class="topbar">
      <h2 id="lesson-title">Lesson Time</h2>
      <div class="progress" aria-hidden="true"><i id="lesson-bar"></i></div>
      <button class="btn ghost small" id="lesson-skip" type="button">I'm ready to play ▶</button>
    </div>
    <div class="lesson-card" id="lesson-card"></div>
    <div class="lesson-nav">
      <button class="btn alt" id="lesson-back" type="button">◀ Back</button>
      <button class="btn alt speak" id="lesson-speak" type="button">🔊 Read to me</button>
      <button class="btn" id="lesson-next" type="button">Next ▶</button>
    </div>
  </section>

  <!-- BOARD -->
  <section id="scr-board" hidden>
    <div class="topbar">
      <div class="scores" id="scores"></div>
      <button class="btn ghost small" id="quit" type="button">🏠 Home</button>
    </div>
    <p class="round-tag" id="round-tag"></p>
    <p class="turn-line" id="turn-line"></p>
    <div class="board" id="board"></div>
    <div class="board-foot"><button class="btn ghost small" id="review" type="button">📚 Review the lesson</button></div>
  </section>

  <!-- FINAL / END -->
  <section id="scr-final" hidden>
    <div class="center-card" id="final-card"></div>
  </section>
</main>

<div class="modal" id="modal" hidden>
  <div class="clue" id="clue" role="dialog" aria-modal="true" aria-labelledby="clue-q"></div>
</div>

<script>
/* ===== Question bank =====
   Each question: [grade, emoji, question, answer, [wrong answers], lesson fact]
   The fact is shown in the lesson and again after answering. <b> marks the answer. */
const BANK = [
 { id: "animals", name: "Animals", emoji: "🐾", intro: "Let's meet some amazing animals!", qs: [
  [1, "🐶", "What is a baby dog called?", "A puppy", ["A kitten", "A calf", "A cub"], "A baby dog is called a <b>puppy</b>."],
  [1, "🐄", "Which animal says “moo”?", "A cow", ["A pig", "A duck", "A horse"], "A <b>cow</b> says “moo!” Cows give us milk."],
  [2, "🦘", "What is a baby kangaroo called?", "A joey", ["A kit", "A chick", "A foal"], "A baby kangaroo is called a <b>joey</b>. It rides in its mom's pouch."],
  [2, "🕷️", "How many legs does a spider have?", "8", ["6", "4", "10"], "Spiders have <b>8 legs</b>. That's two more than an insect!"],

  [3, "🦒", "Which animal is the tallest in the world?", "The giraffe", ["The elephant", "The camel", "The ostrich"], "The <b>giraffe</b> is the tallest animal. Its neck alone can be 6 feet long!"],
  [4, "🐋", "What is the largest animal that has ever lived?", "The blue whale", ["The African elephant", "T. rex", "The great white shark"], "The <b>blue whale</b> is the biggest animal ever. It's even bigger than any dinosaur!"],
  [4, "🦁", "What is a group of lions called?", "A pride", ["A pack", "A herd", "A flock"], "A group of lions is called a <b>pride</b>."],

 { id: "body", name: "My Body", emoji: "🧠", intro: "Let's learn how your amazing body works!", qs: [

 { id: "math", name: "Math Magic", emoji: "➕", intro: "Numbers are like magic! Let's practice.", qs: [

 ]},
 { id: "words", name: "Word Wizards", emoji: "📚", intro: "Let's play with letters and words!", qs: [

 { id: "earth", name: "Weather & Earth", emoji: "🌦️", intro: "Let's explore our planet and its weather!", qs: [

 { id: "plants", name: "Plants & Bugs", emoji: "🌻", intro: "Let's dig into the garden!", qs: [

 { id: "ocean", name: "Ocean Life", emoji: "🐙", intro: "Let's dive deep into the ocean!", qs: [

 { id: "dinoexperts", group: "fun", name: "Dino Experts", emoji: "🦴", intro: "Only for real dinosaur experts. These are tough!", qs: [
  [2, "🦕", "Which dinosaur's name means “three-horned face”?", "Triceratops", ["Stegosaurus", "Pachycephalosaurus", "Allosaurus"], "<b>Triceratops</b> means “three-horned face.”"],
  [3, "🦖", "What does “Tyrannosaurus rex” mean?", "Tyrant lizard king", ["Terrible lizard", "Speedy thief", "Big tooth"], "Tyrannosaurus rex means <b>tyrant lizard king</b>."],
  [3, "🦃", "What does “Velociraptor” mean?", "Speedy thief", ["Tyrant king", "Roof lizard", "Big claw"], "Velociraptor means <b>speedy thief</b>. Real ones were about the size of a turkey and had feathers!"],
  [3, "🦅", "Was the Pteranodon a dinosaur?", "No, it was a flying reptile", ["Yes, a flying dinosaur", "No, it was a bird", "Yes, the fastest one"], "<b>No, it was a flying reptile</b>. Pterosaurs were cousins of the dinosaurs."],
  [3, "⏳", "What are the three periods of the dinosaur age, in order?", "Triassic, Jurassic, Cretaceous", ["Jurassic, Triassic, Cretaceous", "Cretaceous, Jurassic, Triassic", "Stone Age, Bronze Age, Iron Age"], "The dinosaur age goes <b>Triassic, Jurassic, Cretaceous</b>."],
  [4, "🐊", "Which giant meat-eater had a tall sail on its back and hunted fish?", "Spinosaurus", ["Allosaurus", "Iguanodon", "Ankylosaurus"], "<b>Spinosaurus</b> had a tall sail on its back and hunted fish. It was even longer than T. rex!"],
  [4, "🔨", "Which armored dinosaur had a big bony club on the end of its tail?", "Ankylosaurus", ["Stegosaurus", "Parasaurolophus", "Diplodocus"], "<b>Ankylosaurus</b> was covered in armor and swung a bony tail club."],
  [4, "🎺", "Which duck-billed dinosaur had a long, hollow head crest that may have made trumpet sounds?", "Parasaurolophus", ["Triceratops", "Velociraptor", "Brachiosaurus"], "<b>Parasaurolophus</b> may have blown air through its crest to make loud honking sounds."],
  [4, "🌊", "Was the Mosasaurus a dinosaur?", "No, it was a sea reptile", ["Yes, a swimming dinosaur", "No, it was a fish", "Yes, the biggest one"], "<b>No, it was a sea reptile</b>. Mosasaurs swam in the oceans while dinosaurs walked on land."],
  [4, "🦴", "In which period did T. rex live?", "The Cretaceous", ["The Triassic", "The Jurassic", "The Ice Age"], "T. rex lived in <b>the Cretaceous</b>, the last period of the dinosaur age."],
  [5, "🗡️", "What is a “thagomizer”?", "The spikes on a Stegosaurus's tail", ["A dinosaur's tooth", "A fossil-digging tool", "A baby dinosaur"], "A thagomizer is <b>the spikes on a Stegosaurus's tail</b>."],
  [5, "🥚", "Which dinosaur's name means “good mother lizard” because it cared for its babies?", "Maiasaura", ["Oviraptor", "Microraptor", "Coelophysis"], "<b>Maiasaura</b> means “good mother lizard.” Scientists found its nests full of babies."],
  [5, "🌍", "When the first dinosaurs lived, all the land was one giant supercontinent. What was it called?", "Pangaea", ["Atlantis", "Antarctica", "Australia"], "All the land was joined in one supercontinent called <b>Pangaea</b>."],
  [5, "🐦", "Which famous fossil animal had feathers and wings like a bird, but teeth like a dinosaur?", "Archaeopteryx", ["Pterodactyl", "Dodo", "Dimetrodon"], "<b>Archaeopteryx</b> was part bird, part dinosaur, with feathers and sharp teeth."],
  [5, "🦕", "Which South American giant is one of the biggest dinosaurs ever found?", "Argentinosaurus", ["Compsognathus", "Velociraptor", "Iguanodon"], "<b>Argentinosaurus</b> was one of the biggest animals ever to walk on land."],
  [5, "☄️", "About how long ago did the dinosaurs (except birds) die out?", "66 million years ago", ["6,000 years ago", "1 million years ago", "1 billion years ago"], "The dinosaurs died out about <b>66 million years ago</b>."],
 ]},

/* ===== Saved settings (this device only) ===== */
function load(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }
function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }

let prefs = Object.assign({ count: 1, names: DEFAULT_NAMES.slice(), level: "all", read: true, bot: false, botLevel: "medium", topics: "mix" }, load("bb-prefs", {}));

/* ===== Computer player ===== */
const BOT_NAME = "Robo";
const BOT_LEVELS = [
  { id: "easy",   name: "Easy",   sub: "Robo makes lots of mistakes", acc: 0.45 },
  { id: "medium", name: "Medium", sub: "A fair match",                acc: 0.68 },
  { id: "hard",   name: "Hard",   sub: "Robo is super smart",         acc: 0.9 },
];
const botLevel = () => BOT_LEVELS.find((l) => l.id === prefs.botLevel) || BOT_LEVELS[1];
// Harder squares (higher rows) are harder for Robo too
const botGetsIt = (row) => Math.random() < botLevel().acc - row * 0.05;
const isBot = (p) => !!(p && p.bot);
const nameTag = (p) => (isBot(p) ? "🤖 " : "") + esc(p.name);

let botTimer = null, botToken = 0;
function botWait(ms, fn) { clearTimeout(botTimer); const t = ++botToken; botTimer = setTimeout(() => { if (t === botToken) fn(); }, ms); }
function botCancel() { clearTimeout(botTimer); botToken++; }
// Give the kid time to hear the question before Robo answers
const readTime = (text) => (prefs.read && canSpeak ? Math.max(3200, plain(text).length * 80) : 2600);
let seen = new Set(load("bb-seen", []));

/* ===== Game state ===== */
let S = null; // { screen, players, cols, star, turn, lesson, lessonIdx, final }

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const plain = (s) => s.replace(/<[^>]+>/g, "");
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function q(catId, idx) {
  const cat = BANK.find((c) => c.id === catId);
  const [g, e, text, a, w, f] = cat.qs[idx];
  return { cat, g, e, text, a, w, f, key: catId + "-" + idx };
}

/* Pick the 5 questions for a category, easiest (100) to hardest (500). */
function pickClues(cat, range) {
  const [lo, hi] = range;
  const used = new Set();
  const out = [];
  for (let i = 0; i < 5; i++) {
    const target = lo + (hi - lo) * (i / 4);
    let best = -1, bestScore = Infinity;
    cat.qs.forEach((item, idx) => {
      if (used.has(idx)) return;
      const score = Math.abs(item[0] - target) + (seen.has(cat.id + "-" + idx) ? 0.75 : 0) + Math.random() * 0.2;
      if (score < bestScore) { bestScore = score; best = idx; }
    });
    used.add(best);
    out.push(best);
  }
  return out.sort((a, b) => cat.qs[a][0] - cat.qs[b][0]);
}

const gameLevel = () => LEVELS.find((l) => l.id === prefs.level) || LEVELS[3];
const fitsTopics = (c) => prefs.topics === "mix" || (prefs.topics === "fun") === (c.group === "fun");

/* Five categories that haven't been used yet this game. Mix = at least 2 of each kind. */
function chooseCats(usedIds) {
  const avail = BANK.filter((c) => !usedIds.includes(c.id) && fitsTopics(c));
  if (prefs.topics !== "mix") return shuffle(avail).slice(0, 5);
  const school = shuffle(avail.filter((c) => c.group !== "fun"));
  const fun = shuffle(avail.filter((c) => c.group === "fun"));
  const rest = shuffle(school.slice(2).concat(fun.slice(2)));
  return shuffle(school.slice(0, 2).concat(fun.slice(0, 2), rest[0]));
}
function buildCols(cats, mult) {
  return cats.map((cat) => ({
    cat: cat.id,
    clues: pickClues(cat, gameLevel().range).map((idx, r) => ({ idx, value: VALUES[r] * mult, done: false, ok: null })),
  }));
}
/* Daily Double squares go in different columns, never in the top (easiest) row. */
function placeStars(n) {
  return shuffle([0, 1, 2, 3, 4]).slice(0, n).map((c) => ({ c, r: 1 + Math.floor(Math.random() * 4) }));
}

function newGame() {
  const level = gameLevel();
  const boardCats = chooseCats([]);
  // Final question: hardest available in a category not on the board
  const finalCat = pick(BANK.filter((c) => !boardCats.includes(c) && fitsTopics(c)));
  const fIdx = pickClues(finalCat, [level.range[1], level.range[1]])[0];
  S = {
    screen: "lesson",
    round: 1,
    players: prefs.names.slice(0, prefs.count).map((n, i) => ({ name: (n || "").trim() || DEFAULT_NAMES[i], score: 0 }))
      .concat(prefs.bot ? [{ name: BOT_NAME, score: 0, bot: true }] : []),
    cols: buildCols(boardCats, 1),
    past: [],
    stars: placeStars(1),
    turn: 0,
    lessonIdx: 0,
    final: { cat: finalCat.id, idx: fIdx, step: 0, player: 0, wagers: [], answers: [] },
  };
}

/* Double Jeopardy: new topics, double values, two Daily Double squares. Lowest score picks first. */
function startDoubleRound() {
  const used = S.cols.map((c) => c.cat).concat(S.final.cat);
  S.past = S.past.concat(S.cols);
  S.cols = buildCols(chooseCats(used), 2);
  S.stars = placeStars(2);
  S.round = 2;
  const low = Math.min(...S.players.map((p) => p.score));
  S.turn = S.players.findIndex((p) => p.score === low);
  startLesson();
}

/* ===== Speech & sound ===== */
const canSpeak = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
function speak(text) {
  if (!canSpeak) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(plain(text));
    u.rate = 0.9; u.pitch = 1.05;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function hush() { if (canSpeak) try { speechSynthesis.cancel(); } catch (e) {} }

let actx = null;
function tone(freqs, dur = 0.14, type = "triangle", gap = 0.11) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      const t = actx.currentTime + i * gap;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
    });
  } catch (e) {}
}
const sndRight = () => tone([523, 659, 784, 1047], 0.18);
const sndWrong = () => tone([330, 262], 0.25, "sine", 0.18);
const sndTap = () => tone([660], 0.07);

/* ===== Confetti ===== */
const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(n = 120) {
  if (reduceMotion) return;
  const cv = $("confetti"), ctx = cv.getContext("2d");
  const W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cols = ["#FFC83D", "#FF6B57", "#3CCB7F", "#4CB8FF", "#FF7FC8", "#FFFFFF"];
  const parts = Array.from({ length: n }, () => ({
    x: W / 2 + (Math.random() - 0.5) * W * 0.3, y: H * 0.45, vx: (Math.random() - 0.5) * 16, vy: -Math.random() * 16 - 6,
    s: 6 + Math.random() * 8, c: pick(cols), r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
  }));
  let frames = 0;
  (function step() {
    ctx.clearRect(0, 0, W, H);
    parts.forEach((p) => {
      p.vy += 0.45; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.vx *= 0.99;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
    });
    if (++frames < 150) requestAnimationFrame(step); else ctx.clearRect(0, 0, W, H);
  })();
}

/* ===== Screens ===== */
function show(screen) {
  hush();
  botCancel();
  ["home", "lesson", "board", "final"].forEach((s) => { $("scr-" + s).hidden = s !== screen; });

}

/* ----- Lesson ----- */
function lessonCards() {
  const cards = [];
  S.cols.forEach((col, ci) => {
    const cat = BANK.find((c) => c.id === col.cat);
    cards.push({ type: "intro", ci, cat });
    col.clues.forEach((cl) => cards.push({ type: "fact", ci, cat, item: q(col.cat, cl.idx) }));
  });
  if (S.round !== 2) cards.push({ type: "final", item: q(S.final.cat, S.final.idx) });
  cards.push({ type: "ready" });
  return cards;
}
function startLesson(fromBoard) {
  S.lessonFromBoard = !!fromBoard;
  if (!fromBoard) S.lessonIdx = 0;
  show("lesson");
  $("lesson-title").textContent = S.round === 2 ? "Double Jeopardy Lesson" : "Lesson Time";
  $("lesson-skip").textContent = fromBoard ? "Back to the board ▶" : "I'm ready to play ▶";
  renderLesson();
}
function renderLesson() {
  const cards = lessonCards();
  const i = Math.max(0, Math.min(S.lessonIdx, cards.length - 1));
  S.lessonIdx = i;
  const c = cards[i];
  $("lesson-bar").style.width = Math.round((i / (cards.length - 1)) * 100) + "%";
  let html = "", say = "";
  if (c.type === "intro") {
    html = `<span class="cat-pill ${COLORS[c.ci]}">Topic ${c.ci + 1} of 5</span>
      <div class="pic" aria-hidden="true">${c.cat.emoji}</div>
      <h3>${esc(c.cat.name)}</h3>
      <p class="fact">${esc(c.cat.intro)}</p>`;
    say = c.cat.name + ". " + c.cat.intro;
  } else if (c.type === "fact") {
    html = `<span class="cat-pill ${COLORS[c.ci]}">${c.cat.emoji} ${esc(c.cat.name)}</span>
      <div class="pic" aria-hidden="true">${c.item.e}</div>
      <p class="fact">${c.item.f}</p>
      <p class="peek">On the board you might see: <strong>${esc(c.item.text)}</strong></p>`;
    say = c.item.f;
  } else if (c.type === "final") {
    html = `<span class="cat-pill c1">⭐ Final Jeopardy sneak peek</span>
      <div class="pic" aria-hidden="true">${c.item.e}</div>
      <p class="fact">${c.item.f}</p>
      <p class="peek">This one is saved for the very last question. Try to remember it!</p>`;
    say = "Final Jeopardy sneak peek! " + c.item.f;
  } else {
    html = `<div class="pic" aria-hidden="true">🎉</div>
      <h3>You're ready!</h3>
      <p class="fact">You learned ${cards.filter((x) => x.type === "fact" || x.type === "final").length} facts. Now let's see how many you remember.</p>`;
    say = "You're ready! Now let's see how many you remember.";
  }
  $("lesson-card").innerHTML = html;
  $("lesson-card").dataset.say = say;
  $("lesson-back").disabled = i === 0;
  $("lesson-back").style.visibility = i === 0 ? "hidden" : "visible";
  const last = i === cards.length - 1;
  $("lesson-next").textContent = last ? (S.lessonFromBoard ? "Back to the board ▶" : "Let's play! ▶") : "Next ▶";
  $("lesson-next").classList.toggle("green", last);
  $("lesson-speak").hidden = !canSpeak;
  if (prefs.read) speak(say); else hush();
}
$("lesson-next").addEventListener("click", () => {
  const total = lessonCards().length;

});

/* ----- Board ----- */
function startBoard() { show("board"); renderBoard(); }
function renderBoard() {
  const multi = S.players.length > 1;
  $("scores").innerHTML = S.players.map((p, i) =>
    `<div class="score ${multi && i === S.turn ? "turn" : ""}"><span>${nameTag(p)}</span><span class="pts">${p.score}</span></div>`).join("");
  const now = S.players[S.turn], botTurn = isBot(now);
  $("round-tag").textContent = S.round === 2 ? "Double Jeopardy · Double points!" : "Round 1";
  $("round-tag").classList.toggle("double", S.round === 2);
  $("turn-line").textContent = botTurn ? `🤖 ${now.name} is picking a square…` : multi ? `${now.name}, pick a square!` : "Pick a square!";
  $("board").innerHTML = S.cols.map((col, ci) => {
    const cat = BANK.find((c) => c.id === col.cat);
    return `<div class="col">
      <div class="cat-head ${COLORS[ci]}"><span class="e" aria-hidden="true">${cat.emoji}</span><span class="n">${esc(cat.name)}</span></div>
      ${col.clues.map((cl, ri) => cl.done
        ? `<button type="button" class="tile done" disabled aria-label="${esc(cat.name)} ${cl.value}, done">${cl.ok ? "✓" : "·"}</button>`
        : `<button type="button" class="tile" data-c="${ci}" data-r="${ri}" aria-label="${esc(cat.name)} for ${cl.value}">${cl.value}</button>`).join("")}

function botPickSquare() {
  const open = [];
  S.cols.forEach((col, ci) => col.clues.forEach((cl, ri) => { if (!cl.done) open.push({ ci, ri }); }));
  if (!open.length) return;
  // Hard Robo goes for the big points first; the others pick at random
  let choice = pick(open);
  if (prefs.botLevel === "hard") { const top = Math.max(...open.map((o) => o.ri)); choice = pick(open.filter((o) => o.ri === top)); }
  const tile = $("board").querySelector(`.tile[data-c="${choice.ci}"][data-r="${choice.ri}"]`);
  if (tile) tile.classList.add("bot-pick");
  sndTap();
  botWait(900, () => openClue(choice.ci, choice.ri));
}
$("board").addEventListener("click", (e) => {
  const t = e.target.closest(".tile[data-c]"); if (!t) return;

});

$("quit").addEventListener("click", () => {

  b.dataset.armed = "1"; b.textContent = "Tap again to quit";
  setTimeout(() => { if (b.dataset.armed) { delete b.dataset.armed; b.textContent = "🏠 Home"; } }, 3000);

/* ----- Clue ----- */
let current = null;
function openClue(ci, ri) {
  const col = S.cols[ci], cl = col.clues[ri];
  const item = q(col.cat, cl.idx);
  const isStar = S.stars.some((s) => s.c === ci && s.r === ri);
  current = { ci, ri, item, isStar, value: cl.value * (isStar ? 2 : 1), order: shuffle([item.a, ...item.w]) };
  const multi = S.players.length > 1;
  $("clue").innerHTML = `
    <div class="clue-top"><span class="cat-pill ${COLORS[ci]}">${item.cat.emoji} ${esc(item.cat.name)}</span><span class="val">${current.value} points</span></div>
    ${isStar ? `<div class="star-banner">⭐ Daily Double! Double points! ⭐</div>` : ""}
    ${multi ? `<div class="who">${nameTag(S.players[S.turn])}'s turn</div>` : ""}
    <p class="q" id="clue-q">${esc(item.text)}</p>
    <div class="choices" id="choices">
      ${current.order.map((c, i) => `<button type="button" class="choice" data-i="${i}"><span class="k">${"ABCD"[i]}</span><span>${esc(c)}</span></button>`).join("")}
    </div>
    <div id="clue-result"></div>
    <div class="clue-actions" id="clue-actions">
      ${canSpeak ? `<button type="button" class="btn alt small" id="clue-speak">🔊 Read to me</button>` : ""}
    </div>`;
  $("modal").hidden = false;
  if (isStar) sndStar(); else sndTap();
  const sayQ = () => speak(item.text + " " + current.order.map((c, i) => "ABCD"[i] + ". " + c + ".").join(" "));
  if ($("clue-speak")) $("clue-speak").onclick = sayQ;
  if (prefs.read) setTimeout(sayQ, isStar ? 700 : 150);
  $("choices").onclick = (e) => { const b = e.target.closest(".choice"); if (b && !current.answered) answer(+b.dataset.i); };
  if (isBot(S.players[S.turn])) {
    $("choices").classList.add("locked");
    $("clue-result").innerHTML = `<div class="thinking">🤖 ${esc(BOT_NAME)} is thinking<i>.</i><i>.</i><i>.</i></div>`;
    const sayText = item.text + " " + current.order.join(" ");
    botWait(readTime(sayText) + (isStar ? 700 : 0), () => {
      const right = current.order.indexOf(item.a);
      const i = botGetsIt(ri) ? right : pick([0, 1, 2, 3].filter((j) => j !== right));
      $("choices").children[i].classList.add("bot-pick");
      botWait(900, () => answer(i));
    });
    return;
  }
  const first = $("clue").querySelector(".choice"); if (first) first.focus({ preventScroll: true });
}
function answer(i) {
  current.answered = true;
  const picked = current.order[i], ok = picked === current.item.a;
  const cl = S.cols[current.ci].clues[current.ri];
  cl.done = true; cl.ok = ok; cl.by = S.turn;
  const player = S.players[S.turn], bot = isBot(player);
  if (!bot) { seen.add(current.item.key); save("bb-seen", [...seen]); }
  if (ok) player.score += current.value;
  $("choices").querySelectorAll(".choice").forEach((b, j) => {
    b.disabled = true;
    if (current.order[j] === current.item.a) b.classList.add("right");
    else if (j === i) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const multi = S.players.length > 1;
  const head = bot ? (ok ? `${BOT_NAME} got it!` : `${BOT_NAME} missed it!`) : ok ? pick(CHEERS) : pick(COMFORT);
  const sub = ok ? `+${current.value} points${multi ? " for " + esc(player.name) : ""}!` : `The answer is <b>${esc(current.item.a)}</b>.`;
  $("clue-result").innerHTML = `<div class="result ${ok ? "ok" : "no"}"><h3>${bot ? "🤖 " : ok ? "🎉 " : "💡 "}${head}</h3><p>${sub}</p><p>${current.item.f}</p></div>`;
  $("clue-actions").innerHTML = `<button type="button" class="btn green" id="clue-done">Back to the board ▶</button>`;
  $("clue-done").onclick = closeClue;
  $("clue-done").focus({ preventScroll: true });
  if (ok) { sndRight(); if (!bot) confetti(current.isStar ? 220 : 110); } else sndWrong();
  if (prefs.read) speak(head + " " + (ok ? "" : "The answer is " + current.item.a + ". ") + plain(current.item.f));
}
function closeClue() {
  hush();
  botCancel();
  $("modal").hidden = true;
  S.turn = (S.turn + 1) % S.players.length;
  current = null;
  const left = S.cols.some((c) => c.clues.some((cl) => !cl.done));
  if (left) renderBoard(); else if (S.round === 1) startRoundBreak(); else startFinal();
}

/* ----- Between rounds: Double Jeopardy or straight to the Final Jeopardy ----- */
function startRoundBreak() { show("final"); S.screen = "break"; renderRoundBreak(); }
function renderRoundBreak() {
  const multi = S.players.length > 1;

      : `<p>You have <strong>${S.players[0].score}</strong> points!</p>`}

/* ----- Final Jeopardy ----- */
function startFinal() { S.final.step = 0; S.final.player = 0; S.final.wagers = []; S.final.answers = []; S.final.order = null; show("final"); renderFinal(); }
function wagerOptions(sc) {
  const opts = sc > 0
    ? [{ v: 0, t: "Keep my points safe" }, { v: Math.max(100, Math.round(sc / 200) * 100), t: "Bet about half" }, { v: sc, t: "Bet it all!" }]
    : [{ v: 500, t: "Free try!" }];
  const seenV = new Set();
  return opts.filter((o) => (seenV.has(o.v) ? false : seenV.add(o.v)));
}
function botWager(sc, opts) {
  if (sc <= 0) return opts[0];
  if (prefs.botLevel === "easy") return pick(opts);
  const best = Math.max(0, ...S.players.filter((p) => !isBot(p)).map((p) => p.score));
  if (prefs.botLevel === "hard") return sc > best * 2 ? opts[0] : sc <= best ? opts[opts.length - 1] : opts[Math.min(1, opts.length - 1)];
  return opts[Math.min(1, opts.length - 1)];
}
function renderFinal() {
  const F = S.final, item = q(F.cat, F.idx), card = $("final-card");
  const multi = S.players.length > 1;
  if (F.step === 0) {
    card.innerHTML = `<div class="trophy" aria-hidden="true">⭐</div><h2>The Final Jeopardy!</h2>
      <p>One last question about <strong>${item.cat.emoji} ${esc(item.cat.name)}</strong>. First, choose how many points to bet.</p>
      <button type="button" class="btn big" id="f-go">Let's do it! ▶</button>`;
    $("f-go").onclick = () => { F.step = 1; renderFinal(); };
    if (prefs.read) speak("The Final Jeopardy! One last question about " + item.cat.name + ". First, choose how many points to bet.");
    return;
  }
  const p = S.players[F.player], bot = isBot(p);
  if (F.step === 1) {
    const sc = p.score, opts = wagerOptions(sc);
    const choose = (o) => { F.wagers[F.player] = { v: o.v, free: sc <= 0 }; F.step = 2; sndTap(); renderFinal(); };
    if (bot) {
      card.innerHTML = `<h2>🤖 ${esc(p.name)}'s bet</h2><p>${esc(p.name)} has <strong>${sc}</strong> points.</p>
        <div class="thinking">Choosing a bet<i>.</i><i>.</i><i>.</i></div>`;
      const o = botWager(sc, opts);
      botWait(1800, () => {
        card.querySelector(".thinking").textContent = `${p.name} bets ${o.v}!`;
        if (prefs.read) speak(p.name + " bets " + o.v + "!");
        botWait(1600, () => choose(o));
      });
      return;
    }
    card.innerHTML = `<h2>${multi ? esc(p.name) + ", place your bet" : "Place your bet"}</h2>
      <p>You have <strong>${sc}</strong> points. If you're right, you win your bet. If you miss, you lose it.</p>
      <div class="wagers">${opts.map((o) => `<button type="button" class="btn ${o.v === sc && sc > 0 ? "" : "alt"}" data-v="${o.v}">${o.t} (${o.v})</button>`).join("")}</div>
      ${sc > 0 ? "" : `<p class="note">No points yet? This one is a free try. You can't lose anything!</p>`}`;
    card.querySelector(".wagers").onclick = (e) => {
      const b = e.target.closest("[data-v]"); if (!b) return;
      choose(opts.find((o) => o.v === +b.dataset.v));
    };
    if (prefs.read) speak((multi ? p.name + ", " : "") + "place your bet. You have " + sc + " points.");
    return;
  }
  if (F.step === 2) {
    const order = F.order || (F.order = shuffle([item.a, ...item.w]));
    card.innerHTML = `<span class="cat-pill">${item.cat.emoji} ${esc(item.cat.name)} · ${multi ? nameTag(p) + " · " : ""}bet ${F.wagers[F.player].v}</span>
      <p class="q" id="clue-q">${esc(item.text)}</p>
      <div class="choices" id="f-choices">${order.map((c, i) => `<button type="button" class="choice" data-i="${i}"><span class="k">${"ABCD"[i]}</span><span>${esc(c)}</span></button>`).join("")}</div>
      <div id="f-result" style="width:100%"></div><div class="clue-actions" id="f-actions">${canSpeak ? `<button type="button" class="btn alt small" id="f-speak">🔊 Read to me</button>` : ""}</div>`;
    const sayText = item.text + " " + order.map((c, i) => "ABCD"[i] + ". " + c + ".").join(" ");
    const sayQ = () => speak(sayText);
    if ($("f-speak")) $("f-speak").onclick = sayQ;
    if (prefs.read) setTimeout(sayQ, 150);
    const finalAnswer = (i) => {
      if (F.answers[F.player] !== undefined) return;
      const ok = order[i] === item.a, w = F.wagers[F.player];
      F.answers[F.player] = ok;
      if (ok) p.score += w.v; else if (!w.free) p.score -= w.v;
      $("f-choices").querySelectorAll(".choice").forEach((x, j) => {
        x.disabled = true;
        if (order[j] === item.a) x.classList.add("right"); else if (j === i) x.classList.add("wrong"); else x.classList.add("dim");
      });
      const head = bot ? (ok ? `${p.name} got it!` : `${p.name} missed it!`) : ok ? pick(CHEERS) : pick(COMFORT);
      $("f-result").innerHTML = `<div class="result ${ok ? "ok" : "no"}"><h3>${bot ? "🤖 " : ok ? "🎉 " : "💡 "}${head}</h3>
        <p>${ok ? `+${w.v} points!` : w.free || w.v === 0 ? "No points lost." : `−${w.v} points.`}</p><p>${item.f}</p></div>`;
      const more = F.player < S.players.length - 1;
      $("f-actions").innerHTML = `<button type="button" class="btn green" id="f-next">${more ? `${nameTag(S.players[F.player + 1])}'s turn ▶` : "See who won! 🏆"}</button>`;
      $("f-next").onclick = () => { hush(); botCancel(); if (more) { F.player++; F.step = 1; } else F.step = 3; renderFinal(); };
      if (ok) { sndRight(); if (!bot) confetti(160); } else sndWrong();
      if (prefs.read) speak(head + " " + (ok ? "" : "The answer is " + item.a + ". ") + plain(item.f));
    };
    if (bot) {
      $("f-choices").classList.add("locked");
      $("f-result").innerHTML = `<div class="thinking">🤖 ${esc(p.name)} is thinking<i>.</i><i>.</i><i>.</i></div>`;
      botWait(readTime(sayText), () => {
        const right = order.indexOf(item.a);
        const i = botGetsIt(4) ? right : pick([0, 1, 2, 3].filter((j) => j !== right));
        $("f-choices").children[i].classList.add("bot-pick");
        botWait(900, () => finalAnswer(i));
      });
    } else {
      $("f-choices").onclick = (e) => { const b = e.target.closest(".choice"); if (b) finalAnswer(+b.dataset.i); };
    }
    return;
  }
  // step 3: results
  const allCols = S.past.concat(S.cols), boardTotal = allCols.length * 5;
  const rightBy = (i) => allCols.reduce((n, c) => n + c.clues.filter((cl) => cl.ok && cl.by === i).length, 0);
  const ranked = S.players.map((pl, i) => ({ ...pl, i, right: rightBy(i) })).sort((a, b) => b.score - a.score);
  const top = ranked[0].score;
  const winners = ranked.filter((r) => r.score === top);
  const botWon = winners.length === 1 && isBot(winners[0]);
  const title = !multi ? "Great game!" : winners.length > 1 ? "It's a tie!" : `${esc(winners[0].name)} wins!`;
  card.innerHTML = `<div class="trophy" aria-hidden="true">${botWon ? "🤖" : "🏆"}</div><h2>${title}</h2>
    ${!multi ? `<p>You finished with <strong>${S.players[0].score}</strong> points and got <strong>${ranked[0].right} of ${boardTotal}</strong> board questions right!</p>` : ""}
    ${botWon ? `<p>Robo won this time. Play again and see if you can beat Robo!</p>` : ""}
    ${multi ? `<div class="podium">${ranked.map((r) => `<div class="row ${r.score === top ? "win" : ""}"><span aria-hidden="true">${r.score === top ? "🥇" : "⭐"}</span><span class="nm">${nameTag(r)}<small>${r.right} board questions right</small></span><span class="pts">${r.score}</span></div>`).join("")}</div>` : ""}
    <div class="clue-actions">
      <button type="button" class="btn big" id="again">📚 New game</button>
      <button type="button" class="btn alt" id="home">🏠 Home</button>
    </div>`;
  $("again").onclick = () => { newGame(); startLesson(); };
  $("home").onclick = () => { S = null; show("home"); renderHome(); };
  if (!botWon) { confetti(260); tone([523, 659, 784, 1047, 784, 1047], 0.2, "triangle", 0.14); }
  if (prefs.read) speak(plain(title) + (!multi ? " You finished with " + S.players[0].score + " points." : botWon ? " Play again and see if you can beat Robo!" : ""));
}

/* ===== Boot (keeps a game in progress across page updates) ===== */
function start(data) {
  renderHome();
  if (data && data.S && data.S.cols) {
    S = data.S;
    // Games saved before the Double Jeopardy existed
    S.round = S.round || 1; S.past = S.past || []; S.stars = S.stars || (S.star ? [S.star] : []);
    if (S.screen === "lesson") { show("lesson"); renderLesson(); }
    else if (S.screen === "break") startRoundBreak();
    else if (S.screen === "final") { show("final"); renderFinal(); }
    else startBoard();
  } else show("home");
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
